   SOUND MANAGER - synthesized audio via Web Audio API

const SoundManager = (() => {
  let ctx = null
  let unlocked = false
  let shakeNode = null
  let popBuffer = null
  let revealBuffer = null

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)()
    return ctx
  }

  async function loadBuffer(url) {
    const c = getCtx()
    const res = await fetch(url)
    const arr = await res.arrayBuffer()
    return await c.decodeAudioData(arr)
  }
  ;(async () => {
    try {
      const [pop, reveal] = await Promise.all([
        loadBuffer('assets/balloon-pop.mp3'),
        loadBuffer('assets/winner-fanfare.mp3'),
      ])
      popBuffer = pop
      revealBuffer = reveal
      popOnset = findOnsetOffset(pop)
      revealOnset = findOnsetOffset(reveal)
    } catch (e) {
      console.error('[SoundManager] gagal memuatkan fail audio:', e)
    }
  })()

  function playBuffer(buffer, { volume = 1, delay = 0, offset = 0 } = {}) {
    if (!unlocked || !buffer) return
    const c = getCtx()
    const src = c.createBufferSource()
    src.buffer = buffer
    const gain = c.createGain()
    gain.gain.value = volume
    src.connect(gain).connect(c.destination)
    src.start(c.currentTime + delay, offset)   // ← offset skips leading silence
    return src
  }

  function unlock() {
    const c = getCtx()
    if (c.state === 'suspended') c.resume()
    unlocked = true
  }

  function createNoiseBuffer(duration) {
    const c = getCtx()
    const bufferSize = c.sampleRate * duration
    const buffer = c.createBuffer(1, bufferSize, c.sampleRate)
    const data = buffer.getChannelData(0)
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1
    return buffer
  }

  function tone(freq, duration = 0.3, type = 'sine', volume = 0.3) {
    if (!unlocked) return
    const c = getCtx()
    const osc = c.createOscillator()
    const gain = c.createGain()
    osc.type = type
    osc.frequency.value = freq
    gain.gain.setValueAtTime(volume, c.currentTime)
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration)
    osc.connect(gain).connect(c.destination)
    osc.start()
    osc.stop(c.currentTime + duration)
  }

  function noise({ duration = 0.5, volume = 0.3, filterFreq = 800, filterType = 'bandpass' } = {}) {
    if (!unlocked) return
    const c = getCtx()
    const src = c.createBufferSource()
    src.buffer = createNoiseBuffer(duration)
    const filter = c.createBiquadFilter()
    filter.type = filterType
    filter.frequency.value = filterFreq
    const gain = c.createGain()
    gain.gain.setValueAtTime(volume, c.currentTime)
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration)
    src.connect(filter).connect(gain).connect(c.destination)
    src.start()
    src.stop(c.currentTime + duration)
  }

  function shakeStart() {
    if (!unlocked || shakeNode) return
    const c = getCtx()
    const src = c.createBufferSource()
    src.buffer = createNoiseBuffer(2)
    src.loop = true
    const filter = c.createBiquadFilter()
    filter.type = 'lowpass'
    filter.frequency.value = 200
    const gain = c.createGain()
    gain.gain.value = 0.25
    src.connect(filter).connect(gain).connect(c.destination)
    src.start()
    shakeNode = src
  }

  function shakeStop() {
    if (shakeNode) { shakeNode.stop(); shakeNode = null }
  }

  return {
    unlock,
    click:   () => tone(880, 0.08, 'square', 0.2),
    shakeStart,
    shakeStop,
    open:    () => noise({ duration: 0.6, volume: 0.35, filterFreq: 1200, filterType: 'highpass' }),
    release: () => {
      if (!unlocked) return
      const c = getCtx()
      const t0 = c.currentTime
      const dur = 0.35 + Math.random() * 0.15
      const src = c.createBufferSource()
      src.buffer = createNoiseBuffer(dur)
      const filter = c.createBiquadFilter()
      filter.type = 'bandpass'
      filter.Q.value = 0.7
      const baseFreq = 900 + Math.random() * 600
      filter.frequency.setValueAtTime(baseFreq * 0.5, t0)
      filter.frequency.linearRampToValueAtTime(baseFreq, t0 + dur * 0.4)
      filter.frequency.linearRampToValueAtTime(baseFreq * 0.6, t0 + dur)
      const gain = c.createGain()
      gain.gain.setValueAtTime(0, t0)
      gain.gain.linearRampToValueAtTime(0.06, t0 + dur * 0.3)
      gain.gain.linearRampToValueAtTime(0.001, t0 + dur)
      src.connect(filter).connect(gain).connect(c.destination)
      src.start(t0)
      src.stop(t0 + dur)
    },

    reveal: () => playBuffer(revealBuffer, { volume: 0.85, delay: 0.08, offset: revealOnset }),
  }
})()

  /* ============================================================
     RANDOM SELECTION - crypto.getRandomValues()
     Digunakan untuk susunan/masa pelepasan belon secara tidak boleh
     diramal (pemenang sebenar tetap ditentukan oleh operator/DB - ini
     hanya menentukan giliran & masa ia muncul/pecah secara visual)
     ============================================================ */
  function cryptoRandomInt(maxExclusive) {
    const arr = new Uint32Array(1)
    crypto.getRandomValues(arr)
    return arr[0] % maxExclusive
  }
  function cryptoRandomFloat() {
    const arr = new Uint32Array(1)
    crypto.getRandomValues(arr)
    return arr[0] / 4294967296
  }
  function cryptoRandomRange(min, max) {
    return min + cryptoRandomFloat() * (max - min)
  }
  function cryptoShuffle(array) {
    const a = array.slice()
    for (let i = a.length - 1; i > 0; i--) {
      const j = cryptoRandomInt(i + 1)
      ;[a[i], a[j]] = [a[j], a[i]]
    }
    return a
  }

  // Tukar SVG bow kepada mesh 3D - baca path, extrude bagi ketebalan, auto-center &
  // auto-scale ikut bounding box sebenar (jadi tak bergantung nombor tetap dari viewBox asal)
  function createBowFromSvg(ribbonMat) {
    const loader = new SVGLoader()
    const svgData = loader.parse(ribbonSvgMarkup)
  
    const bowGroup = new THREE.Group()
    const extrudeSettings = { depth: 14, bevelEnabled: true, bevelThickness: 3, bevelSize: 2, bevelSegments: 2 }
  
    svgData.paths.forEach((path) => {
      SVGLoader.createShapes(path).forEach((shape) => {
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings)
        const mesh = new THREE.Mesh(geometry, ribbonMat)
        bowGroup.add(mesh)
      })
    })
  
    // auto-center: kira bounding box gabungan semua path, tolak titik tengah dari setiap mesh
    const box = new THREE.Box3().setFromObject(bowGroup)
    const size = new THREE.Vector3()
    box.getSize(size)
    const center = new THREE.Vector3()
    box.getCenter(center)
    bowGroup.children.forEach((mesh) => mesh.position.sub(center))
  
    // auto-scale supaya lebar akhir bow ~0.85 unit dunia, tak kira saiz asal viewBox SVG
    const desiredWidth = 1.2
    const scale = desiredWidth / size.x
    // scale.y NEGATIF sebab paksi-Y SVG terbalik (bawah = positif) berbanding Three.js (atas = positif)
    bowGroup.scale.set(scale, -scale, scale)
  
    return bowGroup
  }
  function createGiftBoxMesh(bodyColor, interiorColor = 0x0d0e12) {
    const group = new THREE.Group()
    const bw = 3.6, bh = 2.35, bd = 3.6, lidH = 0.60
  
    const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.32, metalness: 0.12 })
    const interiorMat = new THREE.MeshStandardMaterial({ color: interiorColor, roughness: 0.9, metalness: 0 })
    const ribbonMat = new THREE.MeshStandardMaterial({
      color: 0xd4af37,
      roughness: 0.45,
      metalness: 0.0,
    })
  
    // muka sisi/bawah guna bodyMat (luaran), muka atas guna interiorMat gelap -
    // muka atas inilah yang terdedah bila lid terbuka, memberi kesan "dalam kotak" yang realistik
    const body = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), [
      bodyMat, bodyMat, interiorMat, bodyMat, bodyMat, bodyMat,
    ])
    body.position.y = bh / 2
    group.add(body)
  
    const ribbonV = new THREE.Mesh(new THREE.BoxGeometry(bw * 0.15, bh - 0.02, bd + 0.02), ribbonMat)
    ribbonV.position.y = bh / 2 - 0.01
    group.add(ribbonV)
    const ribbonH = new THREE.Mesh(new THREE.BoxGeometry(bw + 0.02, bh - 0.02, bd * 0.15), ribbonMat)
    ribbonH.position.y = bh / 2 - 0.01
    group.add(ribbonH)
  
    // penutup (lid), berhinge di tepi belakang supaya boleh berputar terbuka
    const lidPivot = new THREE.Object3D()
    lidPivot.position.set(0, bh, -bd / 2)
    group.add(lidPivot)
  
    // BoxGeometry face order: [+x, -x, +y (top), -y (bottom), +z, -z]
    // muka bawah (index 3) guna interiorMat gelap supaya bahagian dalam lid nampak hitam
    const lid = new THREE.Mesh(new THREE.BoxGeometry(bw * 1.08, lidH, bd * 1.08), [
      bodyMat, bodyMat, bodyMat, interiorMat, bodyMat, bodyMat,
    ])
    lid.position.set(0, lidH / 2, bd * 0.54)
    lidPivot.add(lid)
  
    // pita menegak (vertical) di atas lid - muka bawah guna interiorMat supaya bahagian dalam kekal hitam
    const lidRibbonV = new THREE.Mesh(new THREE.BoxGeometry(bw * 0.15, lidH * 1.02, bd * 1.08), [
      ribbonMat, ribbonMat, ribbonMat, interiorMat, ribbonMat, ribbonMat,
    ])
    lidRibbonV.position.set(0, lidH / 2 + 0.005, bd * 0.54)
    lidPivot.add(lidRibbonV)
  
    // pita melintang (horizontal) di atas lid - muka bawah guna interiorMat supaya bahagian dalam kekal hitam
    const lidRibbonH = new THREE.Mesh(new THREE.BoxGeometry(bw * 1.08, lidH * 1.02, bd * 0.16), [
      ribbonMat, ribbonMat, ribbonMat, interiorMat, ribbonMat, ribbonMat,
    ])
    lidRibbonH.position.set(0, lidH / 2 + 0.005, bd * 0.54)
    lidPivot.add(lidRibbonH)
  
    // bow dari fail SVG - loop, ekor & band tengah semua sekali dalam satu bentuk
    const bowGroup = createBowFromSvg(ribbonMat)
    bowGroup.position.set(0, lidH + 0.14, bd * 0.54 + 0.3)
    lidPivot.add(bowGroup)
  
    return { group, lidPivot, bodyTopY: bh, bodyMat }
  }

  function createGlowSprite(hexColor, size) {
    const canvas = document.createElement('canvas')
    canvas.width = 256; canvas.height = 256
    const ctx = canvas.getContext('2d')
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128)
    grad.addColorStop(0, 'rgba(255,204,0,0.85)')
    grad.addColorStop(0.45, 'rgba(255,204,0,0.3)')
    grad.addColorStop(1, 'rgba(255,204,0,0)')
    ctx.fillStyle = grad
    ctx.fillRect(0, 0, 256, 256)
    const texture = new THREE.CanvasTexture(canvas)
    const mat = new THREE.SpriteMaterial({
      map: texture, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending,
    })
    const sprite = new THREE.Sprite(mat)
    sprite.scale.set(size, size, 1)
    return sprite
  }

  function createBalloonMesh(colorHex) {
    const group = new THREE.Group()
  
    const bodyGeo = new THREE.SphereGeometry(1, 28, 22)
    bodyGeo.scale(1, 1.22, 1)
    const bodyMat = new THREE.MeshStandardMaterial({
      color: colorHex, roughness: 0.28, metalness: 0.05, transparent: true, opacity: 1,
      emissive: colorHex, emissiveIntensity: 0,
    })
    const body = new THREE.Mesh(bodyGeo, bodyMat)
    body.position.y = 1.22
    group.add(body)
  
    const knot = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.24, 12), bodyMat)
    knot.rotation.x = Math.PI
    knot.position.y = -0.02
    group.add(knot)
  
    const stringGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -0.1, 0), new THREE.Vector3(0, -1.8, 0),
    ])
    const stringMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 })
    group.add(new THREE.Line(stringGeo, stringMat))
  
    group.userData.material = bodyMat
    return group
  }

  function fitFontSize(ctx, text, maxWidth, baseSize) {
    let size = baseSize
    ctx.font = `bold ${size}px -apple-system, Segoe UI, Roboto, sans-serif`
    while (ctx.measureText(text).width > maxWidth && size > 20) {
      size -= 4
      ctx.font = `bold ${size}px -apple-system, Segoe UI, Roboto, sans-serif`
    }
    return size
  }

  function createNameSprite(text) {
    const canvas = document.createElement('canvas')
    canvas.width = 512
    canvas.height = 170
    const ctx = canvas.getContext('2d')

    ctx.fillStyle = 'rgba(255,255,255,0.94)'
    const r = 30
    ctx.beginPath()
    ctx.moveTo(r, 6)
    ctx.arcTo(506, 6, 506, 164, r)
    ctx.arcTo(506, 164, 6, 164, r)
    ctx.arcTo(6, 164, 6, 6, r)
    ctx.arcTo(6, 6, 506, 6, r)
    ctx.closePath()
    ctx.fill()

    ctx.fillStyle = '#010066'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    const size = fitFontSize(ctx, text, 460, 62)
    ctx.font = `bold ${size}px -apple-system, Segoe UI, Roboto, sans-serif`
    ctx.fillText(text, 256, 88)

    const texture = new THREE.CanvasTexture(canvas)
    texture.minFilter = THREE.LinearFilter
    const mat = new THREE.SpriteMaterial({
      map: texture,
      transparent: false, alphaTest: 0.5,
      depthWrite: true, depthTest: true,
    })
    const sprite = new THREE.Sprite(mat)
    sprite.scale.set(2.7, 0.9, 1)
    return sprite
  }

  const activeConfetti = []
  function spawnConfetti(position, count = 220) {
    const positions = new Float32Array(count * 3)
    const velocities = new Float32Array(count * 3)
    const colors = new Float32Array(count * 3)
    const palette = [
      new THREE.Color(0xffcc00), new THREE.Color(0xcc0001),
      new THREE.Color(0x8ea0ff), new THREE.Color(0xffffff),
    ]
    for (let i = 0; i < count; i++) {
      positions[i * 3] = position.x
      positions[i * 3 + 1] = position.y
      positions[i * 3 + 2] = position.z

      const speed = 4 + cryptoRandomFloat() * 6
      const angle = cryptoRandomFloat() * Math.PI * 2
      const upward = 3 + cryptoRandomFloat() * 5
      velocities[i * 3] = Math.cos(angle) * speed
      velocities[i * 3 + 1] = upward
      velocities[i * 3 + 2] = Math.sin(angle) * speed

      const c = palette[cryptoRandomInt(palette.length)]
      colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b
    }
    const geo = new THREE.BufferGeometry()
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3))
    const mat = new THREE.PointsMaterial({
      size: 0.18, vertexColors: true, transparent: true, opacity: 1,
      depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
    })
    const points = new THREE.Points(geo, mat)
    points.renderOrder = 999
    points.userData = { velocities, life: 0, maxLife: 3.2 }
    scene.add(points)
    activeConfetti.push(points)
  }

  function updateConfetti(dt) {
    for (let i = activeConfetti.length - 1; i >= 0; i--) {
      const p = activeConfetti[i]
      const pos = p.geometry.attributes.position.array
      const vel = p.userData.velocities
      for (let j = 0; j < pos.length; j += 3) {
        vel[j + 1] -= 9.8 * dt
        pos[j] += vel[j] * dt
        pos[j + 1] += vel[j + 1] * dt
        pos[j + 2] += vel[j + 2] * dt
      }
      p.geometry.attributes.position.needsUpdate = true
      p.userData.life += dt
      p.material.opacity = Math.max(0, 1 - p.userData.life / p.userData.maxLife)
      if (p.userData.life >= p.userData.maxLife) {
        scene.remove(p)
        p.geometry.dispose()
        p.material.dispose()
        activeConfetti.splice(i, 1)
      }
    }
  }

  /* ============================================================
     STATE MACHINE UTAMA CABUTAN
     idle -> shaking -> releasing (belon dilepaskan seorang-seorang,
     pemenang cuma salah satu daripadanya) -> winner (kekal sehingga
     cabutan seterusnya)
     ============================================================ */
  let phase = 'idle'
  let phaseStartTime = 0
  let releaseStartTime = 0
  let releaseSchedule = []   // [{ name, emitAtMs, isWinner }]
  let nextScheduleIndex = 0
  let activeBalloons = []    // belon yang sedang di udara
  let winnerRevealed = false
  let currentWinnerMykad = ''
  let dramaticMode = false
  let allReleasedTriggered = false

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3) }
  function easeOutBack(t) { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2) }
  function easeInOutSine(t) { return -(Math.cos(Math.PI * t) - 1) / 2 }
  function clamp01(t) { return Math.min(1, Math.max(0, t)) }

  function showPrizeOverlay(prizeName) {
    el.winnerPrizeBadge.textContent = prizeName || ''
    el.prizeIconBadge.textContent = pickPrizeIcon(prizeName)
    el.prizeOverlay.classList.add('visible')
  }

  function showWinnerOverlay(name, mykad) {
    el.winnerName.textContent = name
    el.winnerMykad.textContent = maskMykad(mykad)
    el.winnerOverlay.classList.add('visible')
  }

  function clearStage() {
    activeBalloons.forEach((b) => scene.remove(b.group))
    activeBalloons = []
    activeConfetti.forEach((p) => { scene.remove(p); p.geometry.dispose(); p.material.dispose() })
    activeConfetti.length = 0
    spotLight.intensity = 0
    el.vignette.style.opacity = 0
    el.winnerOverlay.classList.remove('visible')
    el.prizeOverlay.classList.remove('visible')
    el.winnerPrizeBadge.textContent = ''
    el.prizeIconBadge.textContent = ''
    hemi.intensity = 0.95
    dirLight.intensity = 0.65
    lidOpenTarget = 0
    shakeTimer = 0
    giftBox.group.position.copy(boxRestPosition)
    giftBox.group.rotation.set(0, 0, boxRestRotationZ)
    winnerRevealed = false
    releaseSchedule = []
    nextScheduleIndex = 0
    dramaticMode = false
    allReleasedTriggered = false
  }

    function buildReleaseSchedule(payload) {
    const winnerName = payload.winnerName
    const sourcePool = (payload.names && payload.names.length ? payload.names : candidatePool)
      .filter((n) => n !== winnerName)
    let others = cryptoShuffle(sourcePool).slice(0, CONFIG.balloonCount - 1)
    let fillIndex = 1
    while (others.length < CONFIG.balloonCount - 1) {
      others.push(`Peserta ${fillIndex++}`)
    }

    let order
    if (dramaticMode) {
      // pemenang keluar lewat (2-3 terakhir) supaya ia sentiasa jadi salah satu
      // belon terakhir yang masih di udara - lebih mudah dikesan penonton
      const shuffledOthers = cryptoShuffle(others)
      const lateSlot = shuffledOthers.length - cryptoRandomInt(3) // masuk pada 3 kedudukan terakhir
      shuffledOthers.splice(lateSlot, 0, winnerName)
      order = shuffledOthers
    } else {
      order = cryptoShuffle([...others, winnerName])
    }

    let t = 0
    return order.map((name) => {
      t += cryptoRandomRange(CONFIG.releaseIntervalMinMs, CONFIG.releaseIntervalMaxMs)
      return { name, emitAtMs: t, isWinner: name === winnerName }
    })
  }

  function startDraw(payload) {
    clearStage()
    dramaticMode = payload.category === 'all'
    allReleasedTriggered = false  
    showPrizeOverlay(payload.prizeName)
    currentWinnerMykad = payload.winnerMykad
    releaseSchedule = buildReleaseSchedule(payload)

    phaseStartTime = performance.now()
    shakeTimer = CONFIG.shakeDurationMs
    phase = 'shaking'
    SoundManager.shakeStart()
  }

    function spawnBalloon(entry, now) {
      SoundManager.release()
      const color = CONFIG.colors[cryptoRandomInt(CONFIG.colors.length)]
      const group = createBalloonMesh(color)
      const sprite = createNameSprite(entry.name)
      sprite.position.set(0, 1.0, 1.1)
      group.add(sprite)
    
      const mouth = getBoxMouthPosition(new THREE.Vector3())
      group.position.copy(mouth)
      group.scale.setScalar(0.05)
    
      const finalScale = cryptoRandomRange(CONFIG.balloonScaleMin, CONFIG.balloonScaleMax)
  
      // grand prize (catAll) = slower, more dramatic float
      const riseMin = dramaticMode ? DRAMATIC.riseSpeedMin : CONFIG.balloonRiseSpeedMin
      const riseMax = dramaticMode ? DRAMATIC.riseSpeedMax : CONFIG.balloonRiseSpeedMax
  
      // winner's pop is normally scheduled randomly at spawn time; in dramatic mode
      // it's withheld and only scheduled once ALL balloons have left the box (see updatePhases)
      const popAt = (entry.isWinner && !dramaticMode)
        ? now + cryptoRandomRange(CONFIG.winnerPopDelayMinMs, CONFIG.winnerPopDelayMaxMs)
        : null
  
      const balloon = {
        group, sprite, name: entry.name, isWinner: entry.isWinner,
        spawnTime: now,
        finalScale,
        driftX: cryptoRandomRange(-2.4, 2.4),
        swaySeed: cryptoRandomFloat() * Math.PI * 2,
        riseSpeed: cryptoRandomRange(riseMin, riseMax),
        popAt,
        popped: false,
        baseXAtMouth: mouth.x,
        layerZ: cryptoRandomRange(-1.6, 1.6),
        spawnOffsetX: cryptoRandomRange(-0.9, 0.9),
        collisionOffsetX: 0,
        collisionOffsetZ: 0,
      }
      if (balloon.popAt !== null) {
        balloon.preBurstStartAt = balloon.popAt - (dramaticMode ? DRAMATIC.preBurstGrowMs : CONFIG.winnerPreBurstGrowMs)
      }
      scene.add(group)
      activeBalloons.push(balloon)
    }

    function popWinnerBalloon(balloon) {
    balloon.popped = true
    const pos = balloon.group.position.clone()
    scene.remove(balloon.group)
    activeBalloons = activeBalloons.filter((b) => b !== balloon)
    spawnConfetti(pos, 260)
    SoundManager.pop()
    SoundManager.reveal()          // ← delay is now handled internally, precisely
    spotTarget.position.copy(pos)
    spotLight.position.set(pos.x, pos.y + 8, pos.z + 6)
    spotPulseUntil = performance.now() + 900
    showWinnerOverlay(balloon.name, currentWinnerMykad)
    winnerRevealed = true
    burstRemainingBalloons()
  }

  function burstRemainingBalloons() {
    // sebaik sahaja pemenang diumumkan, pecahkan semua belon lain yang masih di udara / belum hilang dari skrin
    activeBalloons.forEach((b) => {
      const pos = b.group.position.clone()
      scene.remove(b.group)
      spawnConfetti(pos, 70)
    })
    activeBalloons = []
    // hentikan sebarang belon dalam jadual yang belum sempat dilepaskan
    nextScheduleIndex = releaseSchedule.length
  }

  function updateBalloons(now, dt) {
    for (let i = activeBalloons.length - 1; i >= 0; i--) {
      const b = activeBalloons[i]
      const age = now - b.spawnTime
  
      if (age < CONFIG.balloonEmergeMs) {
        const t = clamp01(age / CONFIG.balloonEmergeMs)
        const eased = easeOutBack(t)
        b.group.scale.setScalar(Math.max(0.05, eased * b.finalScale))
        const mouth = getBoxMouthPosition(new THREE.Vector3())
        // gabungkan anjakan awal rawak + offset kolisi terkumpul dengan formula asal,
        // supaya belon tidak semua muncul dari titik yang sama & kolisi kekal berkesan semasa fasa ini
        b.group.position.x = mouth.x + (b.driftX * 0.15) * t + b.spawnOffsetX * t + b.collisionOffsetX
        b.group.position.y = mouth.y + t * 1.1
        b.group.position.z = mouth.z + b.layerZ + b.collisionOffsetZ
      } else {
        if (b.isWinner) {
          const ceiling = dramaticMode ? DRAMATIC.hoverCeiling : CONFIG.normalHoverCeiling
          b.group.position.y = Math.min(b.group.position.y + b.riseSpeed * dt, ceiling)
        } else {
          b.group.position.y += b.riseSpeed * dt
        }
        const riseT = clamp01((b.group.position.y - 1.5) / 12)
        b.group.position.x += (b.driftX * dt * 0.18)
        b.group.position.x += Math.sin(now / 650 + b.swaySeed) * 0.012
  
        if (b.isWinner && !b.popped && b.preBurstStartAt !== undefined && now >= b.preBurstStartAt) {
          const growMs = dramaticMode ? DRAMATIC.preBurstGrowMs : CONFIG.winnerPreBurstGrowMs
          const scaleMult = dramaticMode ? DRAMATIC.preBurstScaleMult : CONFIG.winnerPreBurstScaleMult
          const growT = clamp01((now - b.preBurstStartAt) / growMs)
          const eased = easeInOutSine(growT)
          const scale = b.finalScale * (1 + (scaleMult - 1) * eased)
          b.group.scale.setScalar(scale)
          b.group.position.x += (0 - b.group.position.x) * Math.min(1, dt * 2.2) * eased
          b.group.position.z += (6 - b.group.position.z) * Math.min(1, dt * 2.2) * eased
          if (b.group.userData.material) {
            b.group.userData.material.emissiveIntensity = CONFIG.winnerPreBurstEmissive * eased
          }
        } else {
          b.group.scale.setScalar(b.finalScale)
        }
      }
  
      if (b.isWinner && !b.popped && b.popAt !== null && now >= b.popAt) {
        popWinnerBalloon(b)
        continue
      }
  
      if (b.group.position.y > CONFIG.balloonTopBound) {
        scene.remove(b.group)
        activeBalloons.splice(i, 1)
      }
    }
  }

  function updatePhases(now, dt) {
    if (phase === 'idle') return

    if (phase === 'shaking') {
      shakeTimer -= dt * 1000
      const shakeT = clamp01(shakeTimer / CONFIG.shakeDurationMs)
      const s = CONFIG.shakeStrength * shakeT
      giftBox.group.position.x = boxRestPosition.x + (cryptoRandomFloat() - 0.5) * s
      giftBox.group.rotation.z = boxRestRotationZ + (cryptoRandomFloat() - 0.5) * s * 0.6
      if (shakeTimer <= 0) {
        giftBox.group.position.copy(boxRestPosition)
        giftBox.group.rotation.set(0, 0, boxRestRotationZ)
        releaseStartTime = now
        lidOpenTarget = 1
        phase = 'releasing'
        SoundManager.shakeStop()
        SoundManager.open()
      }
      return
    }

    if (phase === 'releasing') {
      const elapsed = now - releaseStartTime
      while (
        nextScheduleIndex < releaseSchedule.length &&
        releaseSchedule[nextScheduleIndex].emitAtMs <= elapsed
      ) {
        spawnBalloon(releaseSchedule[nextScheduleIndex], now)
        nextScheduleIndex++
      }

      // dramatic mode: begin the winner's countdown only once ALL balloons are released
      if (dramaticMode && !allReleasedTriggered && nextScheduleIndex >= releaseSchedule.length) {
        allReleasedTriggered = true
        const winner = activeBalloons.find((b) => b.isWinner && !b.popped)
        if (winner) {
          const delay = cryptoRandomRange(DRAMATIC.suspenseDelayMinMs, DRAMATIC.suspenseDelayMaxMs)
          winner.popAt = now + delay
          winner.preBurstStartAt = winner.popAt - DRAMATIC.preBurstGrowMs
        }
      }

      if (nextScheduleIndex >= releaseSchedule.length && activeBalloons.length === 0) {
        lidOpenTarget = 0
        phase = winnerRevealed ? 'winner' : 'releasing'
      }
      return
    }
    // 'winner': kekal begini sehingga cabutan seterusnya (startDraw() akan reset)
  }

  // jejari kolisi berkesan untuk sekeping belon (termasuk papan nama, bukan sekadar badan bulat) -
  // papan nama (sprite) lebih lebar (2.7 unit) daripada badan belon (jejari ~1), jadi jika kolisi
  // hanya kira badan, papan nama masih boleh "menembusi" belon jiran secara optik
  const SPRITE_HALF_WIDTH = 1.35 // separuh lebar sprite (scale.x 2.7 / 2)
  
  function resolveBalloonCollisions(dt, now) {
    const pushRate = Math.min(1, dt * CONFIG.balloonSeparationStrength)
    for (let i = 0; i < activeBalloons.length; i++) {
      const a = activeBalloons[i]
      for (let j = i + 1; j < activeBalloons.length; j++) {
        const b = activeBalloons[j]
        const dx = b.group.position.x - a.group.position.x
        const dy = b.group.position.y - a.group.position.y
        const dz = b.group.position.z - a.group.position.z
        const distSq = dx * dx + dy * dy + dz * dz
  
        const aRadius = Math.max(a.finalScale, SPRITE_HALF_WIDTH * a.finalScale)
        const bRadius = Math.max(b.finalScale, SPRITE_HALF_WIDTH * b.finalScale)
        const minDist = aRadius + bRadius + CONFIG.balloonSeparationMargin
        if (distSq >= minDist * minDist || distSq < 0.0001) continue
  
        const dist = Math.sqrt(distSq)
        const overlap = (minDist - dist) * pushRate
        const nx = dx / dist
        const ny = dy / dist
        const nz = dz / dist
  
        // belon pemenang yang sedang dalam fasa mengembang (pre-burst) jadi "immovable" -
        // ia boleh menolak belon lain menjauh, tapi tak boleh ditolak balik oleh sesiapa
        const aIsDominant = a.isWinner && a.preBurstStartAt !== undefined && now >= a.preBurstStartAt
        const bIsDominant = b.isWinner && b.preBurstStartAt !== undefined && now >= b.preBurstStartAt
  
        let pushA, pushB
        if (aIsDominant) {
          pushA = 0
          pushB = overlap
        } else if (bIsDominant) {
          pushB = 0
          pushA = overlap
        } else {
          const totalMass = a.finalScale + b.finalScale
          pushA = overlap * (b.finalScale / totalMass)
          pushB = overlap * (a.finalScale / totalMass)
        }
  
        a.collisionOffsetX -= nx * pushA
        a.collisionOffsetZ -= nz * pushA
        a.group.position.x -= nx * pushA
        a.group.position.y -= ny * pushA * 0.4
        a.group.position.z -= nz * pushA
  
        b.collisionOffsetX += nx * pushB
        b.collisionOffsetZ += nz * pushB
        b.group.position.x += nx * pushB
        b.group.position.y += ny * pushB * 0.4
        b.group.position.z += nz * pushB
      }
    }
  }

  /* ============================================================
     GELUNG RENDER
     ============================================================ */
  const clock = new THREE.Clock()
  function animate() {
    requestAnimationFrame(animate)
    const dt = Math.min(clock.getDelta(), 0.05)
    const now = performance.now()

    // lid sentiasa "mengejar" sasaran buka/tutup secara licin
    const targetAngle = -CONFIG.lidOpenAngle * lidOpenTarget
    giftBox.lidPivot.rotation.x += (targetAngle - giftBox.lidPivot.rotation.x) * Math.min(1, dt * CONFIG.lidLerpSpeed)

    updatePhases(now, dt)
    updateBalloons(now, dt)
    resolveBalloonCollisions(dt, now)
    updateConfetti(dt)
    // nafas cahaya keemasan pada kotak - buat ia sentiasa hidup & menonjol
    boxSpot.intensity = 3.2 + Math.sin(now / 600) * 1.4
    boxGlow.material.opacity = 0.55 + Math.sin(now / 600) * 0.2
    // kilasan lampu sorot pantas semasa detik belon pemenang pecah
    if (now < spotPulseUntil) {
      const remain = (spotPulseUntil - now) / 900
      spotLight.intensity = Math.sin(clamp01(1 - remain) * Math.PI) * 10
      el.vignette.style.opacity = String(Math.sin(clamp01(1 - remain) * Math.PI) * 0.45)
    } else if (spotLight.intensity !== 0) {
      spotLight.intensity = 0
      el.vignette.style.opacity = 0
    }

    renderer.render(scene, camera)
  }
  animate()

  function findOnsetOffset(buffer, threshold = 0.04) {
    const data = buffer.getChannelData(0)
    for (let i = 0; i < data.length; i++) {
      if (Math.abs(data[i]) > threshold) {
        return Math.max(0, i / buffer.sampleRate - 0.005) // sedikit ruang (5ms) sebelum transient
      }
    }
    return 0
  }

  let popOnset = 0
  let revealOnset = 0
</script>

</body>
</html>
