<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/pahang.ico" type="image/x-icon">
<title>Cabutan Bertuah</title>

<style>
  :root {
    --jg-blue: #010066;
    --jg-blue-light: #1a2a8f;
    --jg-red: #cc0001;
    --jg-gold: #ffcc00;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, var(--jg-blue) 0%, var(--jg-blue-light) 45%, var(--jg-red) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------------- Corporate brand bar, pinned top ---------------- */
  .stage-brand-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 1.6dvh 3vw;
    text-align: center;
    color: rgba(255,255,255,0.85);
    z-index: 10;
  }
  .stage-brand-bar .eyebrow {
    font-size: 1.8vw;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .stage-brand-bar img {
    height: 64px;
    width: auto;
    object-fit: contain;
    opacity: 0.95;
  }

  /* thin tricolor accent strip along the very top edge */
  .flag-strip {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 5px;
    z-index: 11;
    background: linear-gradient(90deg, var(--jg-red) 0%, var(--jg-red) 33%, var(--jg-gold) 33%, var(--jg-gold) 66%, var(--jg-blue-light) 66%, var(--jg-blue-light) 100%);
  }

  #stage {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4dvh 4vw;
    text-align: center;
    position: relative;
  }

  /* faint corner watermark star, echoing the brand panel on the registration page */
  #stage::before {
    content: '★';
    position: absolute;
    right: -2dvh;
    bottom: -4dvh;
    font-size: 40dvh;
    line-height: 1;
    color: rgba(255, 204, 0, 0.05);
    pointer-events: none;
  }

  .idle-mark {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(255, 204, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 3dvh;
  }
  .idle-mark::after {
    content: '';
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--jg-gold);
  }
  .idle-text {
    color: rgba(255,255,255,0.75);
    font-size: 2.6dvh;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .name-display {
    color: #fff;
    font-size: 8dvh;
    font-weight: 800;
    line-height: 1.2;
    max-width: 90vw;
    word-break: break-word;
    transition: transform 0.08s ease;
  }
  .name-display.spinning {
    color: rgba(255,255,255,0.85);
  }
  .prize-label {
    color: var(--jg-gold);
    font-size: 3dvh;
    font-weight: 700;
    margin-bottom: 2dvh;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .winner-frame {
    border: 2px solid rgba(255, 204, 0, 0.55);
    border-radius: 24px;
    padding: 5dvh 6vw;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(2px);
  }
  .winner-badge {
    font-size: 6dvh;
    margin-bottom: 1dvh;
  }
  .winner-mykad {
    color: rgba(255,255,255,0.7);
    font-size: 3.2dvh;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-top: 1dvh;
  }
  .confetti-burst {
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="flag-strip"></div>
<div class="stage-brand-bar">
  <span class="eyebrow">Program </span>
  <img src="./assets/SemarakJalurGemilang.png" alt="Semarak Jalur Gemilang">
  <span class="eyebrow">Daerah Bentong 2026</span>
</div>

<div id="stage">
  <div id="idleView">
    <div class="idle-mark"></div>
    <div class="idle-text">Menunggu cabutan seterusnya...</div>
  </div>

  <div id="spinView" style="display:none;">
    <div class="prize-label" id="prizeLabel"></div>
    <div class="name-display spinning" id="nameDisplay">-</div>
  </div>

  <div id="winnerView" style="display:none;">
    <div class="winner-frame">
      <!-- <div class="prize-label" id="winnerPrizeLabel"></div> -->
      <div class="winner-badge">🏆</div>
      <div class="name-display confetti-burst" id="winnerNameDisplay"></div>
      <div class="winner-mykad" id="winnerMykadDisplay"></div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const stageChannel = supabase.channel('cabutan-stage')

  const idleView = document.getElementById('idleView')
  const spinView = document.getElementById('spinView')
  const winnerView = document.getElementById('winnerView')
  const nameDisplay = document.getElementById('nameDisplay')
  const prizeLabel = document.getElementById('prizeLabel')
  const winnerPrizeLabel = document.getElementById('winnerPrizeLabel')
  const winnerNameDisplay = document.getElementById('winnerNameDisplay')
  const winnerMykadDisplay = document.getElementById('winnerMykadDisplay')

  let candidatePool = []

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)]
  }

  // Mask a MyKad number, showing only the last 4 digits, e.g. (********5481)
  function maskMykad(mykad) {
    if (!mykad) return ''
    const digits = String(mykad).replace(/[^0-9]/g, '')
    if (digits.length <= 4) return `(${digits})`
    const last4 = digits.slice(-4)
    return `(${'*'.repeat(digits.length - 4)}${last4})`
  }

  function showIdle() {
    idleView.style.display = 'block'
    spinView.style.display = 'none'
    winnerView.style.display = 'none'
  }

  function showSpin(prizeName) {
    idleView.style.display = 'none'
    spinView.style.display = 'block'
    winnerView.style.display = 'none'
    prizeLabel.textContent = prizeName || ''
  }

  function showWinner(name, prizeName, winnerMykad) {
    idleView.style.display = 'none'
    spinView.style.display = 'none'
    winnerView.style.display = 'block'
    if (winnerPrizeLabel) winnerPrizeLabel.textContent = prizeName || ''
    winnerNameDisplay.textContent = name
    winnerMykadDisplay.textContent = maskMykad(winnerMykad)
  }

  function runSpinAnimation({ names, winnerName, winnerMykad, prizeName, duration }) {
    const pool = names && names.length > 0 ? names : candidatePool
    showSpin(prizeName)

    let elapsed = 0
    let interval = 50

    function tick() {
      if (elapsed >= duration) {
        showWinner(winnerName, prizeName, winnerMykad)
        return
      }
      nameDisplay.textContent = randomFrom(pool.length ? pool : [winnerName])
      elapsed += interval
      if (elapsed > duration * 0.6) interval = 140
      if (elapsed > duration * 0.85) interval = 280
      setTimeout(tick, interval)
    }
    tick()
  }

  stageChannel
    .on('broadcast', { event: 'update-pool' }, ({ payload }) => {
      candidatePool = payload.names || []
    })
    .on('broadcast', { event: 'spin' }, ({ payload }) => {
      runSpinAnimation(payload)
    })
    .subscribe()

  showIdle()
</script>

</body>
</html>
