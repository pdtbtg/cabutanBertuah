<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah</title>

<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100dvh;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #6366f1 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4dvh 4vw;
    text-align: center;
  }
  .idle-emoji {
    font-size: 12dvh;
    margin-bottom: 2dvh;
  }
  .idle-text {
    color: rgba(255,255,255,0.7);
    font-size: 3.2dvh;
    font-weight: 600;
  }
  .name-display {
    color: #fff;
    font-size: 8dvh;
    font-weight: 800;
    line-height: 1.2;
    max-width: 90vw;
    word-break: break-word;
    transition: transform 0.08s ease;
  }
  .name-display.spinning {
    color: rgba(255,255,255,0.85);
  }
  .prize-label {
    color: #c4b5fd;
    font-size: 3dvh;
    font-weight: 600;
    margin-bottom: 2dvh;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .winner-badge {
    font-size: 6dvh;
    margin-bottom: 1dvh;
  }
  .confetti-burst {
    animation: pop 0.5s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="idleView">
    <div class="idle-emoji">🎡</div>
    <div class="idle-text">Menunggu cabutan seterusnya...</div>
  </div>

  <div id="spinView" style="display:none;">
    <div class="prize-label" id="prizeLabel"></div>
    <div class="name-display spinning" id="nameDisplay">-</div>
  </div>

  <div id="winnerView" style="display:none;">
    <div class="prize-label" id="winnerPrizeLabel"></div>
    <div class="winner-badge">🏆</div>
    <div class="name-display confetti-burst" id="winnerNameDisplay"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const stageChannel = supabase.channel('cabutan-stage')

  const idleView = document.getElementById('idleView')
  const spinView = document.getElementById('spinView')
  const winnerView = document.getElementById('winnerView')
  const nameDisplay = document.getElementById('nameDisplay')
  const prizeLabel = document.getElementById('prizeLabel')
  const winnerPrizeLabel = document.getElementById('winnerPrizeLabel')
  const winnerNameDisplay = document.getElementById('winnerNameDisplay')

  let candidatePool = []

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)]
  }

  function showIdle() {
    idleView.style.display = 'block'
    spinView.style.display = 'none'
    winnerView.style.display = 'none'
  }

  function showSpin(prizeName) {
    idleView.style.display = 'none'
    spinView.style.display = 'block'
    winnerView.style.display = 'none'
    prizeLabel.textContent = prizeName
  }

  function showWinner(name, prizeName) {
    idleView.style.display = 'none'
    spinView.style.display = 'none'
    winnerView.style.display = 'block'
    winnerPrizeLabel.textContent = prizeName
    winnerNameDisplay.textContent = name
  }

  function runSpinAnimation({ names, winnerName, prizeName, duration }) {
    const pool = names && names.length > 0 ? names : candidatePool
    showSpin(prizeName)

    let elapsed = 0
    let interval = 50

    function tick() {
      if (elapsed >= duration) {
        showWinner(winnerName, prizeName)
        return
      }
      nameDisplay.textContent = randomFrom(pool.length ? pool : [winnerName])
      elapsed += interval
      if (elapsed > duration * 0.6) interval = 140
      if (elapsed > duration * 0.85) interval = 280
      setTimeout(tick, interval)
    }
    tick()
  }

  stageChannel
    .on('broadcast', { event: 'update-pool' }, ({ payload }) => {
      candidatePool = payload.names || []
    })
    .on('broadcast', { event: 'spin' }, ({ payload }) => {
      runSpinAnimation(payload)
    })
    .subscribe()

  showIdle()
</script>

</body>
</html>
