<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah - Cabutan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  html, body {
    min-height: 100dvh;
    margin: 0;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Login screen - same pattern as admin.html */
  #loginScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2dvh 4vw;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  }
  #loginCard {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 5dvh 6vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  @media (min-width: 992px) {
    #loginCard { max-width: 460px; padding: 6dvh 4vw; }
  }
  .form-floating { margin-bottom: 1.6dvh; }
  .btn-primary {
    background-color: #6366f1;
    border-color: #6366f1;
    font-weight: 600;
    border-radius: 10px;
  }
  .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }

  /* Draw screen */
  #drawScreen {
    display: none;
    padding: 3dvh 3vw;
    max-width: 800px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3dvh;
    flex-wrap: wrap;
    gap: 1dvh;
  }
  .setup-card, .slot-card, .winners-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 3dvh 3vw;
    margin-bottom: 2.5dvh;
  }
  .eligible-badge {
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 600;
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
  }

  /* Slot machine display */
  .slot-window {
    height: 14dvh;
    min-height: 90px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2dvh;
  }
  .slot-window::before, .slot-window::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 30%;
    pointer-events: none;
    z-index: 2;
  }
  .slot-window::before {
    top: 0;
    background: linear-gradient(to bottom, rgba(30,27,75,1), rgba(30,27,75,0));
  }
  .slot-window::after {
    bottom: 0;
    background: linear-gradient(to top, rgba(30,27,75,1), rgba(30,27,75,0));
  }
  .slot-name {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    text-align: center;
    padding: 0 4vw;
  }
  .winner-name {
    font-size: 1.8rem;
    font-weight: 800;
    color: #4f46e5;
    text-align: center;
  }
  .winner-mykad {
    text-align: center;
    color: #6b7280;
    font-size: 0.95rem;
  }

  table { font-size: 0.9rem; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div id="loginCard">
    <div class="text-center mb-4">
      <div style="font-size:2rem;">🔐</div>
      <h5 class="fw-bold mt-2">Admin Cabutan Bertuah</h5>
      <div class="text-muted small">Log masuk untuk buat cabutan</div>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-floating">
        <input type="email" class="form-control" id="loginEmail" placeholder="Emel" required>
        <label for="loginEmail">Emel</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="loginPassword" placeholder="Kata Laluan" required>
        <label for="loginPassword">Kata Laluan</label>
      </div>
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Log Masuk</button>
      </div>
    </form>
  </div>
</div>

<!-- DRAW SCREEN -->
<div id="drawScreen">
  <div class="top-bar">
    <h4 class="fw-bold mb-0">🎡 Cabutan Bertuah</h4>
    <button class="btn btn-outline-danger" id="logoutBtn">Log Keluar</button>
  </div>

  <div class="setup-card">
    <label class="form-label fw-semibold">Nama Cabutan</label>
    <input type="text" class="form-control mb-2" id="drawName" placeholder="cth: Cabutan Ogos 2026">
    <div class="d-flex justify-content-between align-items-center mt-2">
      <span class="eligible-badge" id="eligibleBadge">Memuatkan...</span>
    </div>
  </div>

  <div class="slot-card">
    <div class="slot-window">
      <div class="slot-name" id="slotName">Sedia untuk cabutan</div>
    </div>

    <label class="form-label fw-semibold">Nama Hadiah</label>
    <input type="text" class="form-control mb-3" id="prizeName" placeholder="cth: Voucher RM100">

    <div class="d-grid">
      <button class="btn btn-primary btn-lg" id="drawBtn">🎉 Cabut Sekarang</button>
    </div>

    <div id="resultBox" class="mt-3" style="display:none;">
      <div class="winner-name" id="winnerName"></div>
      <div class="winner-mykad" id="winnerMykad"></div>
    </div>
  </div>

  <div class="winners-card">
    <h6 class="fw-bold mb-3">Senarai Pemenang</h6>
    <table class="table table-sm">
      <thead><tr><th>#</th><th>Nama</th><th>Hadiah</th><th>Masa</th></tr></thead>
      <tbody id="winnersBody">
        <tr><td colspan="4" class="text-center text-muted py-3">Tiada pemenang lagi.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const loginScreen = document.getElementById('loginScreen')
  const drawScreen = document.getElementById('drawScreen')
  const loginForm = document.getElementById('loginForm')
  const loginBtn = document.getElementById('loginBtn')
  const logoutBtn = document.getElementById('logoutBtn')

  const drawNameInput = document.getElementById('drawName')
  const eligibleBadge = document.getElementById('eligibleBadge')
  const slotName = document.getElementById('slotName')
  const prizeNameInput = document.getElementById('prizeName')
  const drawBtn = document.getElementById('drawBtn')
  const resultBox = document.getElementById('resultBox')
  const winnerName = document.getElementById('winnerName')
  const winnerMykad = document.getElementById('winnerMykad')
  const winnersBody = document.getElementById('winnersBody')

  let currentDrawId = null
  let eligibleParticipants = []
  let sessionWinners = []
  let isSpinning = false

  function showDraw() {
    loginScreen.style.display = 'none'
    drawScreen.style.display = 'block'
    initDraw()
  }
  function showLogin() {
    loginScreen.style.display = 'flex'
    drawScreen.style.display = 'none'
  }

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) showDraw()
  })

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    const password = document.getElementById('loginPassword').value
    loginBtn.disabled = true
    loginBtn.textContent = 'Menyemak...'
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    loginBtn.disabled = false
    loginBtn.textContent = 'Log Masuk'
    if (error) {
      alert('Emel atau kata laluan salah.')
      return
    }
    showDraw()
  })

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    showLogin()
  })

  // Get or create today's draw, then load eligible participants (excluding ALL past winners across every draw)
  async function initDraw() {
    eligibleBadge.textContent = 'Memuatkan...'

    // Find or create a draw row
    const todayName = drawNameInput.value.trim() || `Cabutan ${new Date().toLocaleDateString('ms-MY')}`
    drawNameInput.value = todayName

    let { data: existingDraws } = await supabase
      .from('draws')
      .select('*')
      .eq('name', todayName)
      .limit(1)

    if (existingDraws && existingDraws.length > 0) {
      currentDrawId = existingDraws[0].id
    } else {
      const { data: newDraw, error: drawError } = await supabase
        .from('draws')
        .insert([{ name: todayName, status: 'active', draw_date: new Date().toISOString() }])
        .select()
      if (drawError) {
        eligibleBadge.textContent = 'Ralat memuat cabutan'
        console.error(drawError)
        return
      }
      currentDrawId = newDraw[0].id
    }

    await loadEligible()
    await loadWinnersList()
  }

  async function loadEligible() {
    // All participant IDs that have ALREADY won (in any draw, ever)
    const { data: pastWinners } = await supabase
      .from('winners')
      .select('participant_id')

    const wonIds = (pastWinners || []).map(w => w.participant_id)

    let query = supabase.from('participants').select('id, full_name, mykad_number')
    const { data: allParticipants, error } = await query

    if (error) {
      eligibleBadge.textContent = 'Ralat memuat peserta'
      console.error(error)
      return
    }

    eligibleParticipants = allParticipants.filter(p => !wonIds.includes(p.id))
    eligibleBadge.textContent = `${eligibleParticipants.length} peserta layak`
    drawBtn.disabled = eligibleParticipants.length === 0
  }

  async function loadWinnersList() {
    const { data, error } = await supabase
      .from('winners')
      .select('id, prize_name, draw_at, participants(full_name)')
      .order('draw_at', { ascending: false })
      .limit(20)

    if (error || !data || data.length === 0) {
      winnersBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Tiada pemenang lagi.</td></tr>`
      return
    }

    winnersBody.innerHTML = data.map((w, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${w.participants ? w.participants.full_name : '-'}</td>
        <td>${w.prize_name || '-'}</td>
        <td>${new Date(w.draw_at).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</td>
      </tr>
    `).join('')
  }

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)]
  }

  async function runSlotAnimation(finalWinner) {
    return new Promise((resolve) => {
      let elapsed = 0
      const totalDuration = 2800
      let interval = 60

      function tick() {
        if (elapsed >= totalDuration) {
          slotName.textContent = finalWinner.full_name
          resolve()
          return
        }
        slotName.textContent = randomFrom(eligibleParticipants).full_name
        elapsed += interval
        // slow down progressively near the end
        if (elapsed > totalDuration * 0.6) interval = 150
        if (elapsed > totalDuration * 0.85) interval = 300
        setTimeout(tick, interval)
      }
      tick()
    })
  }

  drawBtn.addEventListener('click', async () => {
    if (isSpinning) return
    if (eligibleParticipants.length === 0) {
      alert('Tiada peserta layak untuk dicabut.')
      return
    }
    const prizeName = prizeNameInput.value.trim()
    if (!prizeName) {
      alert('Sila isi nama hadiah.')
      return
    }

    isSpinning = true
    drawBtn.disabled = true
    resultBox.style.display = 'none'

    const winner = randomFrom(eligibleParticipants)
    await runSlotAnimation(winner)

    // Record the winner
    const { error } = await supabase
      .from('winners')
      .insert([{
        draw_id: currentDrawId,
        participant_id: winner.id,
        prize_name: prizeName
      }])

    isSpinning = false
    drawBtn.disabled = false

    if (error) {
      alert('Ralat menyimpan pemenang: ' + error.message)
      return
    }

    winnerName.textContent = winner.full_name
    winnerMykad.textContent = winner.mykad_number
    resultBox.style.display = 'block'
    prizeNameInput.value = ''

    await loadEligible()
    await loadWinnersList()
  })
</script>

</body>
</html>
