<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah - Kawalan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  html, body {
    min-height: 100dvh;
    margin: 0;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #loginScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2dvh 4vw;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  }
  #loginCard {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 5dvh 6vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  @media (min-width: 992px) {
    #loginCard { max-width: 460px; padding: 6dvh 4vw; }
  }
  .form-floating { margin-bottom: 1.6dvh; }
  .btn-primary {
    background-color: #6366f1;
    border-color: #6366f1;
    font-weight: 600;
    border-radius: 10px;
  }
  .btn-primary:hover { background-color: #4f46e5; border-color: #4f46e5; }

  #controlScreen {
    display: none;
    padding: 3dvh 3vw;
    max-width: 700px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3dvh;
    flex-wrap: wrap;
    gap: 1dvh;
  }
  .setup-card, .status-card, .winners-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 3dvh 3vw;
    margin-bottom: 2.5dvh;
  }
  .eligible-badge {
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 600;
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .stage-link-box {
    background: #ecfdf5;
    border: 1px dashed #10b981;
    border-radius: 10px;
    padding: 1.2dvh 1.5vw;
    font-size: 0.85rem;
    color: #047857;
    word-break: break-all;
  }
  table { font-size: 0.9rem; }
</style>
</head>
<body>

<div id="loginScreen">
  <div id="loginCard">
    <div class="text-center mb-4">
      <div style="font-size:2rem;">🔐</div>
      <h5 class="fw-bold mt-2">Kawalan Cabutan Bertuah</h5>
      <div class="text-muted small">Log masuk untuk buat cabutan</div>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-floating">
        <input type="email" class="form-control" id="loginEmail" placeholder="Emel" required>
        <label for="loginEmail">Emel</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="loginPassword" placeholder="Kata Laluan" required>
        <label for="loginPassword">Kata Laluan</label>
      </div>
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Log Masuk</button>
      </div>
    </form>
  </div>
</div>

<div id="controlScreen">
  <div class="top-bar">
    <h4 class="fw-bold mb-0">🎛️ Panel Kawalan</h4>
    <button class="btn btn-outline-danger" id="logoutBtn">Log Keluar</button>
  </div>

  <div class="stage-link-box mb-3">
    📺 Buka skrin pentas (untuk tablet/paparan besar) di:<br>
    <strong id="stageLinkText"></strong>
  </div>

  <div class="setup-card">
    <label class="form-label fw-semibold">Nama Cabutan</label>
    <input type="text" class="form-control mb-2" id="drawName" placeholder="cth: Cabutan Ogos 2026">
    <span class="eligible-badge" id="eligibleBadge">Memuatkan...</span>
  </div>

  <div class="status-card">
    <label class="form-label fw-semibold">Nama Hadiah</label>
    <input type="text" class="form-control mb-3" id="prizeName" placeholder="cth: Voucher RM100">
    <div class="d-grid">
      <button class="btn btn-primary btn-lg" id="drawBtn">🎉 Cabut Sekarang</button>
    </div>
    <div id="lastWinnerBox" class="mt-3 text-center" style="display:none;">
      <div class="fw-bold fs-5 text-primary" id="lastWinnerName"></div>
      <div class="text-muted small" id="lastWinnerMykad"></div>
    </div>
  </div>

  <div class="winners-card">
    <h6 class="fw-bold mb-3">Senarai Pemenang</h6>
    <table class="table table-sm">
      <thead><tr><th>#</th><th>Nama</th><th>Hadiah</th><th>Masa</th></tr></thead>
      <tbody id="winnersBody">
        <tr><td colspan="4" class="text-center text-muted py-3">Tiada pemenang lagi.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const stageChannel = supabase.channel('cabutan-stage')

  const loginScreen = document.getElementById('loginScreen')
  const controlScreen = document.getElementById('controlScreen')
  const loginForm = document.getElementById('loginForm')
  const loginBtn = document.getElementById('loginBtn')
  const logoutBtn = document.getElementById('logoutBtn')

  const drawNameInput = document.getElementById('drawName')
  const eligibleBadge = document.getElementById('eligibleBadge')
  const prizeNameInput = document.getElementById('prizeName')
  const drawBtn = document.getElementById('drawBtn')
  const lastWinnerBox = document.getElementById('lastWinnerBox')
  const lastWinnerName = document.getElementById('lastWinnerName')
  const lastWinnerMykad = document.getElementById('lastWinnerMykad')
  const winnersBody = document.getElementById('winnersBody')
  const stageLinkText = document.getElementById('stageLinkText')

  let currentDrawId = null
  let eligibleParticipants = []
  let isSpinning = false

  // Show the stage.html link relative to this page's own URL
  stageLinkText.textContent = new URL('stage.html', window.location.href).href

  function showControl() {
    loginScreen.style.display = 'none'
    controlScreen.style.display = 'block'
    stageChannel.subscribe()
    initDraw()
  }
  function showLogin() {
    loginScreen.style.display = 'flex'
    controlScreen.style.display = 'none'
  }

  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) showControl()
  })

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    const password = document.getElementById('loginPassword').value
    loginBtn.disabled = true
    loginBtn.textContent = 'Menyemak...'
    const { error } = await supabase.auth.signInWithPassword({ email, password })
    loginBtn.disabled = false
    loginBtn.textContent = 'Log Masuk'
    if (error) {
      alert('Emel atau kata laluan salah.')
      return
    }
    showControl()
  })

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    showLogin()
  })

  async function initDraw() {
    eligibleBadge.textContent = 'Memuatkan...'
    const todayName = drawNameInput.value.trim() || `Cabutan ${new Date().toLocaleDateString('ms-MY')}`
    drawNameInput.value = todayName

    let { data: existingDraws } = await supabase
      .from('draws').select('*').eq('name', todayName).limit(1)

    if (existingDraws && existingDraws.length > 0) {
      currentDrawId = existingDraws[0].id
    } else {
      const { data: newDraw, error: drawError } = await supabase
        .from('draws')
        .insert([{ name: todayName, status: 'active', draw_date: new Date().toISOString() }])
        .select()
      if (drawError) {
        eligibleBadge.textContent = 'Ralat memuat cabutan'
        console.error(drawError)
        return
      }
      currentDrawId = newDraw[0].id
    }

    await loadEligible()
    await loadWinnersList()

    // Tell the stage which candidate pool to cycle through
    stageChannel.send({
      type: 'broadcast',
      event: 'update-pool',
      payload: { names: eligibleParticipants.map(p => p.full_name) }
    })
  }

  async function loadEligible() {
    const { data: pastWinners } = await supabase.from('winners').select('participant_id')
    const wonIds = (pastWinners || []).map(w => w.participant_id)

    const { data: allParticipants, error } = await supabase
      .from('participants').select('id, full_name, mykad_number')

    if (error) {
      eligibleBadge.textContent = 'Ralat memuat peserta'
      console.error(error)
      return
    }

    eligibleParticipants = allParticipants.filter(p => !wonIds.includes(p.id))
    eligibleBadge.textContent = `${eligibleParticipants.length} peserta layak`
    drawBtn.disabled = eligibleParticipants.length === 0
  }

  async function loadWinnersList() {
    const { data, error } = await supabase
      .from('winners')
      .select('id, prize_name, draw_at, participants(full_name)')
      .order('draw_at', { ascending: false })
      .limit(20)

    if (error || !data || data.length === 0) {
      winnersBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Tiada pemenang lagi.</td></tr>`
      return
    }

    winnersBody.innerHTML = data.map((w, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${w.participants ? w.participants.full_name : '-'}</td>
        <td>${w.prize_name || '-'}</td>
        <td>${new Date(w.draw_at).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })}</td>
      </tr>
    `).join('')
  }

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)]
  }

  drawBtn.addEventListener('click', async () => {
    if (isSpinning) return
    if (eligibleParticipants.length === 0) {
      alert('Tiada peserta layak untuk dicabut.')
      return
    }
    const prizeName = prizeNameInput.value.trim()
    if (!prizeName) {
      alert('Sila isi nama hadiah.')
      return
    }

    isSpinning = true
    drawBtn.disabled = true
    lastWinnerBox.style.display = 'none'

    const winner = randomFrom(eligibleParticipants)

    // Tell the stage to start spinning, with the winner pre-decided
    stageChannel.send({
      type: 'broadcast',
      event: 'spin',
      payload: {
        names: eligibleParticipants.map(p => p.full_name),
        winnerName: winner.full_name,
        prizeName: prizeName,
        duration: 2800
      }
    })

    // Wait for the stage animation to roughly finish before saving + refreshing
    await new Promise(r => setTimeout(r, 2900))

    const { error } = await supabase
      .from('winners')
      .insert([{ draw_id: currentDrawId, participant_id: winner.id, prize_name: prizeName }])

    isSpinning = false
    drawBtn.disabled = false

    if (error) {
      alert('Ralat menyimpan pemenang: ' + error.message)
      return
    }

    lastWinnerName.textContent = winner.full_name
    lastWinnerMykad.textContent = winner.mykad_number
    lastWinnerBox.style.display = 'block'
    prizeNameInput.value = ''

    await loadEligible()
    await loadWinnersList()

    stageChannel.send({
      type: 'broadcast',
      event: 'update-pool',
      payload: { names: eligibleParticipants.map(p => p.full_name) }
    })
  })
</script>

</body>
</html>
