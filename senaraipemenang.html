<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/pahang.ico" type="image/x-icon">
<title>Senarai Pemenang – Cabutan Bertuah Semarak Jalur Gemilang 2026</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root {
    --jg-blue:       #010066;
    --jg-blue-light: #1a2a8f;
    --jg-red:        #cc0001;
    --jg-red-dark:   #a30001;
    --jg-gold:       #ffcc00;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100dvh;
    background: #f0f1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111;
  }

  /* ── Header ── */
  .page-header {
    background: linear-gradient(135deg, var(--jg-blue) 0%, var(--jg-blue-light) 55%, var(--jg-red) 100%);
    padding: 2.5dvh 1.5vw 2.2dvh;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: '';
    display: block;
    height: 5px;
    background: linear-gradient(90deg,
      var(--jg-red)  0%,  var(--jg-red)  33%,
      var(--jg-gold) 33%, var(--jg-gold) 66%,
      var(--jg-blue-light) 66%);
    position: absolute;
    bottom: 0; left: 0; right: 0;
  }

  .header-eyebrow {
    font-size: clamp(0.72rem, 1vw, 1rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.70);
    font-weight: 600;
    margin-bottom: 0.6rem;
  }
  .header-title {
    font-size: clamp(1.2rem, 2.4vw, 2rem);
    font-weight: 800;
    color: #fff;
    line-height: 1.3;
    max-width: 100%;
    margin: 0 auto;
    letter-spacing: 0.01em;
  }
  .header-subtitle {
    margin-top: 0.55rem;
    font-size: 0.80rem;
    color: rgba(255,255,255,0.60);
    letter-spacing: 0.04em;
  }

  /* ── Body wrapper ── */
  .page-body {
    max-width: 100%;
    margin: 0;
    padding: 2dvh 1.5vw 3dvh;
  }

  /* ── Stats row ── */
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    margin-bottom: 2.4dvh;
  }
  .stat-pill {
    background: #fff;
    border: 1.5px solid #e2e6f0;
    border-radius: 999px;
    padding: 0.55rem 1.4rem;
    font-size: clamp(0.85rem, 1.1vw, 1.1rem);
    font-weight: 700;
    color: var(--jg-blue);
    letter-spacing: 0.02em;
  }
  .stat-pill span { font-weight: 400; color: #666; margin-left: 0.3rem; }

  /* ── Winner list card ── */
  .winners-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    overflow: hidden;
    /* multi-column layout for big screen */
    columns: 2;
    column-gap: 0;
  }
  @media (max-width: 900px) {
    .winners-card { columns: 1; }
  }

  .winner-row {
    display: grid;
    grid-template-columns: 3.2rem 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1.6rem;
    border-bottom: 1px solid #f0f1f5;
    break-inside: avoid;
    transition: background 0.15s ease;
    animation: slideIn 0.35s ease both;
  }
  .winner-row:last-child { border-bottom: none; }
  .winner-row:hover { background: #f8f9ff; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .winner-num {
    width: 2.8rem;
    height: 2.8rem;
    background: linear-gradient(135deg, var(--jg-blue), var(--jg-blue-light));
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 800;
    flex-shrink: 0;
  }


  .winner-name {
    font-weight: 700;
    font-size: clamp(1rem, 1.4vw, 1.35rem);
    color: #111;
    line-height: 1.25;
    word-break: break-word;
  }
  .winner-mykad {
    font-size: clamp(0.82rem, 1vw, 1.05rem);
    color: #94a3b8;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    letter-spacing: 0.06em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Empty / Loading states ── */
  .state-box {
    padding: 4dvh 2vw;
    text-align: center;
    color: #94a3b8;
  }
  .state-icon { font-size: 2.8rem; margin-bottom: 0.7rem; }
  .state-label { font-size: 0.9rem; font-weight: 500; }

  /* ── Footer ── */
  .page-footer {
    text-align: center;
    font-size: clamp(0.72rem, 0.85vw, 0.9rem);
    color: #94a3b8;
    padding: 1.5dvh 1.5vw 2dvh;
    letter-spacing: 0.04em;
  }

  /* ── Auto-refresh indicator ── */
  .refresh-bar {
    height: 3px;
    background: var(--jg-gold);
    width: 0%;
    transition: width linear;
    border-radius: 0 3px 3px 0;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-title">Senarai Pemenang Cabutan Bertuah<br>Program Semarak Jalur Gemilang Daerah Bentong 2026</div>
  <div class="header-subtitle" id="lastUpdated">Memuat data…</div>
</div>

<div class="refresh-bar" id="refreshBar"></div>

<div class="page-body">

  <div class="stats-row">
    <div class="stat-pill" id="totalPill">— <span>pemenang</span></div>
  </div>

  <div class="winners-card" id="winnersCard">
    <div class="state-box">
      <div class="state-icon">⏳</div>
      <div class="state-label">Sedang memuatkan…</div>
    </div>
  </div>

</div>

<div class="page-footer">
  Data disegarkan setiap 15 saat &nbsp;·&nbsp; Program Semarak Jalur Gemilang 2026
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL     = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const winnersCard  = document.getElementById('winnersCard')
  const totalPill    = document.getElementById('totalPill')
  const lastUpdated  = document.getElementById('lastUpdated')
  const refreshBar   = document.getElementById('refreshBar')

  const REFRESH_MS = 15000   // auto-refresh every 15 seconds

  // ---------------- Mask IC: keep last 4, replace rest with * ----------------
  function maskMykad(ic) {
    if (!ic) return '—'
    const clean = ic.replace(/\D/g, '')   // digits only
    if (clean.length < 4) return '—'
    const last4 = clean.slice(-4)
    const stars = '*'.repeat(clean.length - 4)
    return stars + last4
  }

  // ---------------- Format timestamp (nice Malay style) ----------------
  const MS_MONTHS = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis']
  function formatDateMY(value) {
    const d = new Date(value)
    let h = d.getHours()
    const m = String(d.getMinutes()).padStart(2, '0')
    const ampm = h >= 12 ? 'PM' : 'AM'
    h = h % 12 || 12
    return `${d.getDate()} ${MS_MONTHS[d.getMonth()]} ${d.getFullYear()}, ${h}:${m} ${ampm}`
  }

  // ---------------- Main loader ----------------
  async function loadWinners() {
    const { data, error } = await supabase
      .from('winners')
      .select('id, draw_at, participants(full_name, mykad_number)')
      .order('draw_at', { ascending: true })
      .limit(200)

    if (error) {
      winnersCard.innerHTML = `
        <div class="state-box">
          <div class="state-icon">⚠️</div>
          <div class="state-label">Ralat memuatkan data.<br><small>${error.message}</small></div>
        </div>`
      return
    }

    if (!data || data.length === 0) {
      winnersCard.innerHTML = `
        <div class="state-box">
          <div class="state-icon">🎉</div>
          <div class="state-label">Tiada pemenang direkodkan lagi.</div>
        </div>`
      totalPill.innerHTML = `0 <span>pemenang</span>`
      lastUpdated.textContent = 'Tiada pemenang setakat ini'
      return
    }

    totalPill.innerHTML = `${data.length} <span>pemenang</span>`
    lastUpdated.textContent = `Dikemaskini: ${formatDateMY(new Date())}`

    winnersCard.innerHTML = data.map((w, i) => {
      const name   = w.participants?.full_name  || '—'
      const mykad  = maskMykad(w.participants?.mykad_number || '')
      return `
        <div class="winner-row" style="animation-delay:${Math.min(i * 30, 400)}ms">
          <div class="winner-num">${i + 1}</div>
          <div class="winner-name">${escHtml(name)}</div>
          <div class="winner-mykad">${escHtml(mykad)}</div>
        </div>`
    }).join('')
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  // ---------------- Auto-refresh with progress bar ----------------
  function startRefreshCycle() {
    refreshBar.style.transition = 'none'
    refreshBar.style.width = '0%'
    // trigger reflow so transition resets cleanly
    void refreshBar.offsetWidth
    refreshBar.style.transition = `width ${REFRESH_MS}ms linear`
    refreshBar.style.width = '100%'
  }

  async function tick() {
    await loadWinners()
    startRefreshCycle()
  }

  tick()
  setInterval(tick, REFRESH_MS)

  // Also listen for real-time broadcasts from the control panel so the list
  // updates instantly whenever the operator presses "Cabut Sekarang".
  supabase
    .channel('cabutan-stage')
    .on('broadcast', { event: 'spin' }, () => {
      // Wait for the draw to finish (≈ 3 s) before reloading so the DB row
      // is already written by the time we query.
      setTimeout(loadWinners, 3200)
    })
    .subscribe()
</script>

</body>
</html>
