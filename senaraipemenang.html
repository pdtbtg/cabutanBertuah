<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/pahang.ico" type="image/x-icon">
<title>Senarai Pemenang – Karnival Aspirasi Pahang1st</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  :root {
    --brand: #0f766e;
    --brand-dark: #115e59;
    --brand-soft: #e6f4f1;
    --accent: #f59e0b;
    --accent-soft: #fff7e6;
    --danger: #dc2626;
    --danger-soft: #fdeeee;
    --ink: #1f2937;
    --ink-soft: #6b7280;
    --line: #e3e9e8;
    --surface: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100dvh; margin: 0; }
  body {
    background:
      radial-gradient(900px 500px at 10% -10%, #d9efea 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, #fdf0d8 0%, transparent 55%),
      #f5f8f7;
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------------- Header ---------------- */
  .page-header {
    text-align: center;
    background: rgba(255,255,255,0.85);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 2.2dvh 4vw 1.8dvh;
  }
  .header-title {
    font-weight: 700;
    line-height: 1.3;
    font-size: clamp(1.05rem, 2.2vw, 1.7rem);
    max-width: 1100px;
    margin: 0 auto;
  }
  .header-title .title-year { color: var(--brand); }
  .header-sub {
    margin-top: 0.35rem;
    font-size: clamp(0.85rem, 1.1vw, 1.05rem);
    font-weight: 600;
    color: var(--ink-soft);
  }
  .brand-strip {
    height: 3px;
    background: linear-gradient(90deg, var(--brand) 0%, #5eb8ac 55%, var(--accent) 100%);
  }
  .refresh-bar {
    height: 2px;
    width: 0%;
    background: var(--accent);
    opacity: 0.7;
  }

  /* ---------------- Body ---------------- */
  .page-body { padding: 2.6dvh 2vw 3dvh; max-width: 1600px; margin: 0 auto; }

  .stats-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 2.4dvh;
  }
  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.5rem 1.2rem;
    font-size: clamp(0.85rem, 1.05vw, 1.05rem);
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stat-pill span { font-weight: 500; color: var(--ink-soft); margin-left: 0.3rem; }
  .stat-pill.claimed { background: var(--brand-soft); border-color: #cde8e3; color: var(--brand-dark); }
  .stat-pill.claimed span { color: var(--brand-dark); opacity: 0.8; }

  /* ---------------- Winner list ---------------- */
  .winners-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(15, 60, 55, 0.06), 0 2px 6px rgba(15, 60, 55, 0.03);
    overflow: hidden;
    columns: 2;
    column-gap: 0;
  }
  @media (max-width: 900px) { .winners-card { columns: 1; } }

  .winner-row {
    display: grid;
    grid-template-columns: 2.8rem 1fr auto;
    grid-template-areas:
      "num info mykad"
      "num info claim";
    align-items: center;
    column-gap: 1rem;
    row-gap: 0.25rem;
    padding: 0.85rem 1.4rem;
    border-bottom: 1px solid #eef2f1;
    break-inside: avoid;
  }
  .winner-row.enter { animation: rowIn 0.35s ease both; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .winner-row.is-claimed { background: #f4faf8; }

  .winner-num {
    grid-area: num;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    background: linear-gradient(160deg, #14b8a6, var(--brand));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
  }
  .winner-info { grid-area: info; min-width: 0; }
  .winner-name {
    font-weight: 700;
    font-size: clamp(1rem, 1.35vw, 1.3rem);
    line-height: 1.25;
    word-break: break-word;
  }
  .winner-prize {
    margin-top: 0.15rem;
    font-size: clamp(0.78rem, 0.95vw, 0.95rem);
    font-weight: 600;
    color: #92600a;
  }
  .winner-mykad {
    grid-area: mykad;
    justify-self: end;
    font-size: clamp(0.82rem, 1vw, 1.05rem);
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .claim-cell { grid-area: claim; justify-self: end; }

  /* Public status badge */
  .claim-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .claim-badge.yes { background: var(--brand-soft); border: 1px solid #cde8e3; color: var(--brand-dark); }
  .claim-badge.no  { background: var(--accent-soft); border: 1px solid #fde1a6; color: #92600a; }

  /* Staff checkbox */
  .claim-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    padding: 0.25rem 0.2rem;
  }
  .claim-toggle input {
    width: 1.25rem;
    height: 1.25rem;
    accent-color: var(--brand);
    cursor: pointer;
  }
  .claim-toggle input:disabled { cursor: progress; opacity: 0.6; }

  /* ---------------- States ---------------- */
  .state-box { padding: 5dvh 2vw; text-align: center; color: var(--ink-soft); }
  .state-icon { font-size: 2.6rem; margin-bottom: 0.7rem; }
  .state-label { font-size: 0.92rem; font-weight: 500; }

  .page-footer {
    text-align: center;
    font-size: clamp(0.72rem, 0.85vw, 0.9rem);
    color: var(--ink-soft);
    padding: 1.2dvh 4vw 2.4dvh;
  }
  .page-footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .page-footer a:hover { text-decoration: underline; }

  .toast-msg {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: #1f2937;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.6rem 1.1rem;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    display: none;
    z-index: 200;
    max-width: 90vw;
  }

  @media (prefers-reduced-motion: reduce) {
    .winner-row.enter { animation: none; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-title">Karnival Aspirasi Pahang1st Peringkat Daerah Bentong <span class="title-year">2026</span></div>
  <div class="header-sub" id="headerSub">Senarai Pemenang Cabutan</div>
</div>
<div class="brand-strip"></div>
<div class="refresh-bar" id="refreshBar"></div>

<div class="page-body">
  <div class="stats-row">
    <div class="stat-pill" id="totalPill">— <span>pemenang</span></div>
    <div class="stat-pill claimed" id="claimedPill">— <span>telah dituntut</span></div>
    <div class="stat-pill" id="pendingPill">— <span>belum dituntut</span></div>
  </div>

  <div class="winners-card" id="winnersCard">
    <div class="state-box">
      <div class="state-icon">⏳</div>
      <div class="state-label">Sedang memuatkan…</div>
    </div>
  </div>
</div>

<div class="page-footer">
  <span id="lastUpdated">Memuat data…</span> &nbsp;·&nbsp; Data disegarkan setiap 15 saat
  &nbsp;·&nbsp; <a href="control.html">Panel staf</a>
</div>

<div class="toast-msg" id="toastMsg"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL      = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const winnersCard = document.getElementById('winnersCard')
  const totalPill   = document.getElementById('totalPill')
  const claimedPill = document.getElementById('claimedPill')
  const pendingPill = document.getElementById('pendingPill')
  const lastUpdated = document.getElementById('lastUpdated')
  const refreshBar  = document.getElementById('refreshBar')
  const toastMsg    = document.getElementById('toastMsg')

  const REFRESH_MS = 15000

  let isStaff = false        // true bila pegawai sudah log masuk (sesi dikongsi dengan control.html)
  let busy = false           // sedang menyimpan status tuntutan
  let winners = []
  let hasLoaded = false
  let animateNext = true     // animasi hanya pada paparan pertama
  let lastSig = ''

  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  }

  function showToast(msg) {
    toastMsg.textContent = msg
    toastMsg.style.display = 'block'
    clearTimeout(showToast._t)
    showToast._t = setTimeout(() => { toastMsg.style.display = 'none' }, 3500)
  }

  // ---------------- Mask IC: ********1234 ----------------
  function maskMykad(ic) {
    if (!ic) return '—'
    const clean = ic.replace(/\D/g, '')
    if (clean.length < 4) return '—'
    return '*'.repeat(clean.length - 4) + clean.slice(-4)
  }

  const MS_MONTHS = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis']
  function formatDateMY(value) {
    const d = new Date(value)
    let h = d.getHours()
    const m = String(d.getMinutes()).padStart(2, '0')
    const ampm = h >= 12 ? 'PM' : 'AM'
    h = h % 12 || 12
    return `${d.getDate()} ${MS_MONTHS[d.getMonth()]} ${d.getFullYear()}, ${h}:${m} ${ampm}`
  }

  // ---------------- Pegawai (staff): guna sesi log masuk yang sama dengan control.html ----------------
  supabase.auth.getSession().then(({ data: { session } }) => { isStaff = !!session; lastSig = ''; render() })
  supabase.auth.onAuthStateChange((_event, session) => { isStaff = !!session; lastSig = ''; render() })

  // ---------------- Paparan ----------------
  function render() {
    if (!hasLoaded) return

    const sig = JSON.stringify(winners) + '|' + isStaff
    if (sig === lastSig) return
    lastSig = sig

    const total = winners.length
    const claimedCount = winners.filter(w => w.claimed).length
    totalPill.innerHTML   = `${total} <span>pemenang</span>`
    claimedPill.innerHTML = `${claimedCount} <span>telah dituntut</span>`
    pendingPill.innerHTML = `${total - claimedCount} <span>belum dituntut</span>`

    if (total === 0) {
      winnersCard.innerHTML = `
        <div class="state-box">
          <div class="state-icon">🎉</div>
          <div class="state-label">Tiada pemenang direkodkan lagi.</div>
        </div>`
      return
    }

    const enter = animateNext ? ' enter' : ''
    winnersCard.innerHTML = winners.map((w, i) => {
      const name  = w.participants?.full_name || '—'
      const mykad = maskMykad(w.participants?.mykad_number || '')
      const prize = w.prize_name ? `<div class="winner-prize">${esc(w.prize_name)}</div>` : ''
      const claimCell = isStaff
        ? `<label class="claim-toggle">
             <input type="checkbox" data-id="${esc(w.id)}" ${w.claimed ? 'checked' : ''}>
             Dituntut
           </label>`
        : (w.claimed
            ? `<span class="claim-badge yes">✓ Telah dituntut</span>`
            : `<span class="claim-badge no">Belum dituntut</span>`)
      return `
        <div class="winner-row${w.claimed ? ' is-claimed' : ''}${enter}" style="${animateNext ? `animation-delay:${Math.min(i * 30, 400)}ms` : ''}">
          <div class="winner-num">${i + 1}</div>
          <div class="winner-info">
            <div class="winner-name">${esc(name)}</div>
            ${prize}
          </div>
          <div class="winner-mykad">${esc(mykad)}</div>
          <div class="claim-cell">${claimCell}</div>
        </div>`
    }).join('')
    animateNext = false
  }

  // ---------------- Muat data ----------------
  async function loadWinners() {
    const { data, error } = await supabase
      .from('winners')
      .select('id, draw_at, prize_name, claimed, claimed_at, participants(full_name, mykad_number)')
      .order('draw_at', { ascending: true })
      .limit(200)

    if (error) {
      if (!hasLoaded) {
        winnersCard.innerHTML = `
          <div class="state-box">
            <div class="state-icon">⚠️</div>
            <div class="state-label">Ralat memuatkan data.<br><small>${esc(error.message)}</small></div>
          </div>`
      }
      return
    }

    winners = data || []
    hasLoaded = true
    lastUpdated.textContent = `Dikemaskini: ${formatDateMY(new Date())}`
    render()
  }

  // ---------------- Tanda / nyahtanda tuntutan (pegawai sahaja) ----------------
  winnersCard.addEventListener('change', async (e) => {
    const cb = e.target.closest('input[data-id]')
    if (!cb) return
    const id = cb.dataset.id
    const want = cb.checked

    cb.disabled = true
    busy = true
    const { error } = await supabase.rpc('set_prize_claimed', { p_winner_id: id, p_claimed: want })
    busy = false

    if (error) {
      cb.checked = !want
      cb.disabled = false
      console.error(error)
      showToast(error.message?.includes('NOT_AUTHENTICATED')
        ? 'Sesi tamat. Sila log masuk semula di panel kawalan.'
        : 'Gagal menyimpan: ' + error.message)
      return
    }

    const row = winners.find(w => String(w.id) === id)
    if (row) { row.claimed = want; row.claimed_at = want ? new Date().toISOString() : null }
    lastSig = ''
    render()
  })

  // ---------------- Auto-refresh ----------------
  function startRefreshCycle() {
    refreshBar.style.transition = 'none'
    refreshBar.style.width = '0%'
    void refreshBar.offsetWidth
    refreshBar.style.transition = `width ${REFRESH_MS}ms linear`
    refreshBar.style.width = '100%'
  }

  async function tick() {
    if (!busy) await loadWinners()
    startRefreshCycle()
  }

  tick()
  setInterval(tick, REFRESH_MS)

  // Kemas kini segera bila pengendali membuat cabutan baharu.
  supabase
    .channel('cabutan-stage')
    .on('broadcast', { event: 'spin' }, () => {
      setTimeout(() => { if (!busy) loadWinners() }, 3200)
    })
    .subscribe()
</script>

</body>
</html>
