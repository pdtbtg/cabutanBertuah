<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah - Pendaftaran</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
    color: #1a1a1a;
  }
  p.subtitle {
    color: #666;
    font-size: 14px;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: #6366f1;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #a5a6f6;
    cursor: not-allowed;
  }
  #message {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  #message.success {
    background: #ecfdf5;
    color: #047857;
    display: block;
  }
  #message.error {
    background: #fef2f2;
    color: #b91c1c;
    display: block;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Cabutan Bertuah</h1>
  <p class="subtitle">Isi maklumat di bawah untuk mendaftar</p>

  <form id="registerForm">
    <label for="full_name">Nama Penuh</label>
    <input type="text" id="full_name" required>

    <label for="mykad_number">No. MyKad (12 digit)</label>
    <input type="text" id="mykad_number" maxlength="12" pattern="\d{12}" required>

    <label for="phone_number">No. Telefon</label>
    <input type="text" id="phone_number">

    <label for="email">Emel (pilihan)</label>
    <input type="email" id="email">

    <button type="submit" id="submitBtn">Daftar</button>
  </form>

  <div id="message"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  // ⚠️ Replace these with your actual Supabase project values
  // Found in Supabase Dashboard > Project Settings > API
  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const form = document.getElementById('registerForm')
  const messageEl = document.getElementById('message')
  const submitBtn = document.getElementById('submitBtn')

  function showMessage(text, type) {
    messageEl.textContent = text
    messageEl.className = type
  }

  function isValidMyKad(value) {
    return /^\d{12}$/.test(value)
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()

    const full_name = document.getElementById('full_name').value.trim()
    const mykad_number = document.getElementById('mykad_number').value.trim()
    const phone_number = document.getElementById('phone_number').value.trim()
    const email = document.getElementById('email').value.trim()

    if (!isValidMyKad(mykad_number)) {
      showMessage('No. MyKad mesti 12 digit angka.', 'error')
      return
    }

    submitBtn.disabled = true
    submitBtn.textContent = 'Menghantar...'

    const { data, error } = await supabase
      .from('participants')
      .insert([{
        full_name,
        mykad_number,
        phone_number: phone_number || null,
        email: email || null
      }])
      .select()

    submitBtn.disabled = false
    submitBtn.textContent = 'Daftar'

    if (error) {
      if (error.code === '23505') {
        showMessage('No. MyKad ini sudah didaftarkan.', 'error')
      } else {
        showMessage('Ralat: ' + error.message, 'error')
      }
      console.error(error)
      return
    }

    showMessage('Pendaftaran berjaya! Terima kasih.', 'success')
    form.reset()
  })
</script>

</body>
</html>
