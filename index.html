<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/pahang.ico" type="image/x-icon">
<title>Cabutan Bertuah - Pendaftaran</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  html, body {
    height: 100dvh;
    margin: 0;
  }
  body {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2dvh 4vw;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .auth-shell {
    width: 100%;
    max-width: 440px;
    max-height: 96dvh;
    overflow-y: auto;
    border: none;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  .brand-panel {
    display: none;
  }

  .card-body {
    padding: 4dvh 6vw;
  }
  .brand-title {
    font-weight: 700;
    font-size: 1.4rem;
    color: #1a1a1a;
  }
  .brand-subtitle {
    color: #6b7280;
    font-size: 0.9rem;
  }
  .form-floating > label {
    color: #6b7280;
  }
  .btn-primary {
    background-color: #6366f1;
    border-color: #6366f1;
    padding: 1.2dvh 0;
    font-weight: 600;
    border-radius: 10px;
  }
  .btn-primary:hover {
    background-color: #4f46e5;
    border-color: #4f46e5;
  }
  .form-floating {
    margin-bottom: 1.6dvh;
  }
  .btn-primary:disabled {
    background-color: #a5a6f6;
    border-color: #a5a6f6;
  }

  /* Desktop: widen into a two-column layout with a branding side panel */
  @media (min-width: 992px) {
    .auth-shell {
      max-width: 900px;
      max-height: 88dvh;
      flex-direction: row;
      overflow: hidden;
    }
    .brand-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      width: 42%;
      padding: 5dvh 3vw;
      background: linear-gradient(160deg, #6366f1 0%, #8b5cf6 100%);
      color: #fff;
    }
    .brand-panel .emoji {
      font-size: 3rem;
      margin-bottom: 2dvh;
    }
    .brand-panel h2 {
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 1.2dvh;
    }
    .brand-panel p {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    .form-panel {
      width: 58%;
      overflow-y: auto;
      display: flex;
      align-items: center;
    }
    .form-panel .card-body {
      width: 100%;
      padding: 5dvh 3vw;
    }
    .brand-title, .brand-subtitle {
      display: none; /* shown instead in the side panel on desktop */
    }
  }
</style>
</head>
<body>

  <img src="./assets/SemarakJalurGemilang.png" alt="Logo Pahang" style="height: 40px;">

<div class="auth-shell">

  <div class="brand-panel">
    <div class="emoji">🎡</div>
    <h2>Cabutan Bertuah</h2>
    <p>Daftar sekarang untuk peluang memenangi hadiah menarik. Isi maklumat anda di sebelah untuk menyertai cabutan bertuah kami.</p>
  </div>

  <div class="form-panel">
  <div class="card-body">
    <div class="text-center mb-4">
      <div class="brand-title">🎡 Cabutan Bertuah</div>
      <div class="brand-subtitle">Isi maklumat di bawah untuk mendaftar</div>
    </div>

    <form id="registerForm" novalidate>

      <div class="form-floating">
        <input type="text" class="form-control" id="full_name" placeholder="Nama Penuh" required>
        <label for="full_name">Nama Penuh</label>
      </div>

      <div class="form-floating">
        <input type="text" class="form-control" id="mykad_number" placeholder="No. MyKad" maxlength="12" pattern="\d{12}" required>
        <label for="mykad_number">No. MyKad (12 digit)</label>
      </div>

      <div class="form-floating">
        <input type="text" class="form-control" id="phone_number" placeholder="No. Telefon">
        <label for="phone_number">No. Telefon</label>
      </div>

      <div class="form-floating">
        <input type="email" class="form-control" id="email" placeholder="Emel">
        <label for="email">Emel (pilihan)</label>
      </div>

      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Daftar</button>
      </div>

    </form>
  </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  // Replace with your actual Supabase project values
  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const form = document.getElementById('registerForm')
  const submitBtn = document.getElementById('submitBtn')

  function isValidMyKad(value) {
    return /^\d{12}$/.test(value)
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()

    const full_name = document.getElementById('full_name').value.trim()
    const mykad_number = document.getElementById('mykad_number').value.trim()
    const phone_number = document.getElementById('phone_number').value.trim()
    const email = document.getElementById('email').value.trim()

    if (!full_name) {
      Swal.fire('Ralat', 'Sila isi nama penuh.', 'error')
      return
    }

    if (!isValidMyKad(mykad_number)) {
      Swal.fire('Ralat', 'No. MyKad mesti 12 digit angka.', 'error')
      return
    }

    submitBtn.disabled = true
    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Menyemak...`

    // Check if this MyKad has already registered
    const { data: alreadyRegistered, error: checkError } = await supabase
      .rpc('check_mykad_registered', { check_mykad: mykad_number })

    if (checkError) {
      submitBtn.disabled = false
      submitBtn.textContent = 'Daftar'
      Swal.fire('Ralat', 'Gagal menyemak status pendaftaran: ' + checkError.message, 'error')
      return
    }

    if (alreadyRegistered) {
      submitBtn.disabled = false
      submitBtn.textContent = 'Daftar'
      Swal.fire('Ralat', 'No. MyKad ini sudah didaftarkan.', 'error')
      return
    }

    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Menghantar...`

    const { error } = await supabase
      .from('participants')
      .insert([{
        full_name,
        mykad_number,
        phone_number: phone_number || null,
        email: email || null
      }])

    submitBtn.disabled = false
    submitBtn.textContent = 'Daftar'

    if (error) {
      const msg = error.code === '23505'
        ? 'No. MyKad ini sudah didaftarkan.'
        : 'Ralat: ' + error.message
      Swal.fire('Ralat', msg, 'error')
      console.error(error)
      return
    }

    Swal.fire({
      title: 'Berjaya!',
      text: 'Pendaftaran anda telah diterima. Terima kasih!',
      icon: 'success',
      confirmButtonColor: '#6366f1'
    })
    form.reset()
  })
</script>

</body>
</html>
