<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabutan Bertuah - Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  html, body {
    min-height: 100dvh;
    margin: 0;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Login screen */
  #loginScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2dvh 4vw;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  }
  #loginCard {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 5dvh 6vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .form-floating {
    margin-bottom: 1.6dvh;
  }
  .btn-primary {
    background-color: #6366f1;
    border-color: #6366f1;
    font-weight: 600;
    border-radius: 10px;
  }
  .btn-primary:hover {
    background-color: #4f46e5;
    border-color: #4f46e5;
  }

  /* Dashboard screen */
  #dashboardScreen {
    display: none;
    padding: 3dvh 3vw;
    max-width: 1100px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3dvh;
    flex-wrap: wrap;
    gap: 1dvh;
  }
  .table-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 2dvh 2vw;
    overflow-x: auto;
  }
  .stat-badge {
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  table {
    font-size: 0.9rem;
  }
  #loadingRow td {
    text-align: center;
    padding: 3dvh 0;
    color: #6b7280;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div id="loginCard">
    <div class="text-center mb-4">
      <div style="font-size:2rem;">🔐</div>
      <h5 class="fw-bold mt-2">Admin Cabutan Bertuah</h5>
      <div class="text-muted small">Log masuk untuk lihat senarai peserta</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-floating">
        <input type="email" class="form-control" id="loginEmail" placeholder="Emel" required>
        <label for="loginEmail">Emel</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="loginPassword" placeholder="Kata Laluan" required>
        <label for="loginPassword">Kata Laluan</label>
      </div>
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Log Masuk</button>
      </div>
    </form>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashboardScreen">
  <div class="top-bar">
    <div>
      <h4 class="fw-bold mb-0">Senarai Peserta</h4>
      <span class="stat-badge mt-2 d-inline-block" id="totalCount">0 peserta</span>
    </div>
    <div>
      <input type="text" class="form-control" id="searchBox" placeholder="Cari nama / MyKad..." style="min-width:220px;">
    </div>
    <button class="btn btn-outline-danger" id="logoutBtn">Log Keluar</button>
  </div>

  <div class="table-card">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>#</th>
          <th>Nama Penuh</th>
          <th>No. MyKad</th>
          <th>No. Telefon</th>
          <th>Emel</th>
          <th>Tarikh Daftar</th>
        </tr>
      </thead>
      <tbody id="participantsBody">
        <tr id="loadingRow"><td colspan="6">Memuatkan...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_PUBLISHABLE_KEY'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const loginScreen = document.getElementById('loginScreen')
  const dashboardScreen = document.getElementById('dashboardScreen')
  const loginForm = document.getElementById('loginForm')
  const loginBtn = document.getElementById('loginBtn')
  const logoutBtn = document.getElementById('logoutBtn')
  const participantsBody = document.getElementById('participantsBody')
  const totalCount = document.getElementById('totalCount')
  const searchBox = document.getElementById('searchBox')

  let allParticipants = []

  function formatDate(iso) {
    const d = new Date(iso)
    return d.toLocaleString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
  }

  function renderRows(list) {
    if (list.length === 0) {
      participantsBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Tiada peserta dijumpai.</td></tr>`
      return
    }
    participantsBody.innerHTML = list.map((p, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${p.full_name}</td>
        <td>${p.mykad_number}</td>
        <td>${p.phone_number || '-'}</td>
        <td>${p.email || '-'}</td>
        <td>${formatDate(p.created_at)}</td>
      </tr>
    `).join('')
  }

  async function loadParticipants() {
    const { data, error } = await supabase
      .from('participants')
      .select('*')
      .order('created_at', { ascending: false })

    if (error) {
      participantsBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Ralat: ${error.message}</td></tr>`
      return
    }

    allParticipants = data
    totalCount.textContent = `${data.length} peserta`
    renderRows(data)
  }

  function showDashboard() {
    loginScreen.style.display = 'none'
    dashboardScreen.style.display = 'block'
    loadParticipants()
  }

  function showLogin() {
    loginScreen.style.display = 'flex'
    dashboardScreen.style.display = 'none'
  }

  // Check if already logged in on page load
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) showDashboard()
  })

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    const password = document.getElementById('loginPassword').value

    loginBtn.disabled = true
    loginBtn.textContent = 'Menyemak...'

    const { error } = await supabase.auth.signInWithPassword({ email, password })

    loginBtn.disabled = false
    loginBtn.textContent = 'Log Masuk'

    if (error) {
      Swal.fire ? Swal.fire('Ralat', 'Emel atau kata laluan salah.', 'error') : alert('Emel atau kata laluan salah.')
      return
    }

    showDashboard()
  })

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    showLogin()
  })

  searchBox.addEventListener('input', () => {
    const term = searchBox.value.toLowerCase().trim()
    if (!term) {
      renderRows(allParticipants)
      return
    }
    const filtered = allParticipants.filter(p =>
      p.full_name.toLowerCase().includes(term) ||
      p.mykad_number.includes(term)
    )
    renderRows(filtered)
  })
</script>

</body>
</html>
