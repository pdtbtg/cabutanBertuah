<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/pahang.ico" type="image/x-icon">
<title>Cabutan Bertuah - Admin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  html, body {
    min-height: 100dvh;
    margin: 0;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Login screen */
  #loginScreen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2dvh 4vw;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  }
  #loginCard {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 5dvh 6vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  @media (min-width: 992px) {
    #loginCard {
      max-width: 460px;
      padding: 6dvh 4vw;
    }
    #loginCard h5 {
      font-size: 1.4rem;
    }
  }
  .form-floating {
    margin-bottom: 1.6dvh;
  }
  .btn-primary {
    background-color: #6366f1;
    border-color: #6366f1;
    font-weight: 600;
    border-radius: 10px;
  }
  .btn-primary:hover {
    background-color: #4f46e5;
    border-color: #4f46e5;
  }

  /* Dashboard screen */
  #dashboardScreen {
    display: none;
    padding: 3dvh 3vw;
    max-width: 1100px;
    margin: 0 auto;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 3dvh;
    flex-wrap: wrap;
    gap: 1.5dvh 1dvh;
  }
  .action-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
  }
  .table-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    padding: 2dvh 2vw;
    overflow-x: auto;
  }
  .stat-badge {
    background: #eef2ff;
    color: #4f46e5;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  table {
    font-size: 0.9rem;
  }
  #loadingRow td {
    text-align: center;
    padding: 3dvh 0;
    color: #6b7280;
  }
  th.checkbox-col, td.checkbox-col {
    width: 36px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div id="loginCard">
    <div class="text-center mb-4">
      <div style="font-size:2rem;">🔐</div>
      <h5 class="fw-bold mt-2">Admin Cabutan Bertuah</h5>
      <div class="text-muted small">Log masuk untuk lihat senarai peserta</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-floating">
        <input type="email" class="form-control" id="loginEmail" placeholder="Emel" required>
        <label for="loginEmail">Emel</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="loginPassword" placeholder="Kata Laluan" required>
        <label for="loginPassword">Kata Laluan</label>
      </div>
      <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">Log Masuk</button>
      </div>
    </form>
  </div>
</div>

<!-- DASHBOARD SCREEN -->
<div id="dashboardScreen">
  <div class="top-bar">
    <div>
      <h4 class="fw-bold mb-0">Senarai Peserta</h4>
      <span class="stat-badge mt-2 d-inline-block" id="totalCount">0 peserta</span>
    </div>
    <div class="action-bar">
      <input type="text" class="form-control" id="searchBox" placeholder="Cari nama / MyKad..." style="min-width:200px;">
      <button class="btn btn-outline-success" id="exportBtn">📤 Eksport ke Excel</button>
      <button class="btn btn-outline-danger" id="deleteSelectedBtn" disabled>🗑️ Padam Dipilih (<span id="selectedCount">0</span>)</button>
      <button class="btn btn-outline-danger" id="clearAllBtn">🧹 Kosongkan Senarai</button>
      <button class="btn btn-outline-secondary" id="logoutBtn">Log Keluar</button>
    </div>
  </div>

  <div class="table-card">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th class="checkbox-col"><input type="checkbox" class="form-check-input" id="selectAllCheckbox"></th>
          <th>#</th>
          <th>Nama Penuh</th>
          <th>No. MyKad</th>
          <th>Penyertaan</th>
          <th>Tarikh Daftar</th>
        </tr>
      </thead>
      <tbody id="participantsBody">
        <tr id="loadingRow"><td colspan="6">Memuatkan...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- SheetJS: client-side Excel (.xlsx) export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

  const SUPABASE_URL = 'https://brcxlubmlymtpiwbjwez.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_VX22OseUPH_DdPN_jasgWA_1Vtwg4u9'

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const loginScreen = document.getElementById('loginScreen')
  const dashboardScreen = document.getElementById('dashboardScreen')
  const loginForm = document.getElementById('loginForm')
  const loginBtn = document.getElementById('loginBtn')
  const logoutBtn = document.getElementById('logoutBtn')
  const participantsBody = document.getElementById('participantsBody')
  const totalCount = document.getElementById('totalCount')
  const searchBox = document.getElementById('searchBox')
  const exportBtn = document.getElementById('exportBtn')
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn')
  const selectedCountSpan = document.getElementById('selectedCount')
  const clearAllBtn = document.getElementById('clearAllBtn')
  const selectAllCheckbox = document.getElementById('selectAllCheckbox')

  let allParticipants = []
  let currentList = []          // whatever's currently rendered (respects search)
  const selectedIds = new Set() // ids of currently ticked rows

  function formatDate(iso) {
    const d = new Date(iso)
    return d.toLocaleString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
  }

  function updateSelectionUI() {
    deleteSelectedBtn.disabled = selectedIds.size === 0
    selectedCountSpan.textContent = selectedIds.size
    const rowBoxes = participantsBody.querySelectorAll('.row-checkbox')
    selectAllCheckbox.checked = rowBoxes.length > 0 && selectedIds.size === rowBoxes.length
    selectAllCheckbox.indeterminate = selectedIds.size > 0 && selectedIds.size < rowBoxes.length
  }

  function renderRows(list) {
    currentList = list
    selectedIds.clear() // selection is tied to what's visible; a new render starts fresh

    if (list.length === 0) {
      participantsBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Tiada peserta dijumpai.</td></tr>`
      updateSelectionUI()
      return
    }
    participantsBody.innerHTML = list.map((p, i) => `
      <tr>
        <td class="checkbox-col"><input type="checkbox" class="form-check-input row-checkbox" data-id="${p.id}"></td>
        <td>${i + 1}</td>
        <td>${p.full_name}</td>
        <td>${p.mykad_number}</td>
        <td>${p.urus_setia ? 'Urus Setia' : 'Awam'}</td>
        <td>${formatDate(p.created_at)}</td>
      </tr>
    `).join('')
    updateSelectionUI()
  }

  // One delegated listener handles every row checkbox, including rows
  // added by future re-renders, instead of re-binding per row.
  participantsBody.addEventListener('change', (e) => {
    if (!e.target.classList.contains('row-checkbox')) return
    const id = e.target.dataset.id
    if (e.target.checked) selectedIds.add(id)
    else selectedIds.delete(id)
    updateSelectionUI()
  })

  selectAllCheckbox.addEventListener('change', () => {
    const rowBoxes = participantsBody.querySelectorAll('.row-checkbox')
    rowBoxes.forEach(cb => {
      cb.checked = selectAllCheckbox.checked
      if (selectAllCheckbox.checked) selectedIds.add(cb.dataset.id)
      else selectedIds.delete(cb.dataset.id)
    })
    updateSelectionUI()
  })

  async function loadParticipants() {
    // PostgREST caps a single request at 1000 rows by default, so fetching
    // beyond that silently truncates unless we page through with .range().
    const pageSize = 1000
    let from = 0
    let allData = []

    while (true) {
      const { data, error } = await supabase
        .from('participants')
        .select('*')
        .order('created_at', { ascending: false })
        .range(from, from + pageSize - 1)

      if (error) {
        participantsBody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Ralat: ${error.message}</td></tr>`
        return
      }

      allData = allData.concat(data)
      if (data.length < pageSize) break // last page reached
      from += pageSize
    }

    allParticipants = allData
    totalCount.textContent = `${allData.length} peserta`
    renderRows(allData)
  }

  function showDashboard() {
    loginScreen.style.display = 'none'
    dashboardScreen.style.display = 'block'
    loadParticipants()
  }

  function showLogin() {
    loginScreen.style.display = 'flex'
    dashboardScreen.style.display = 'none'
  }

  // Check if already logged in on page load
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) showDashboard()
  })

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault()
    const email = document.getElementById('loginEmail').value.trim()
    const password = document.getElementById('loginPassword').value

    loginBtn.disabled = true
    loginBtn.textContent = 'Menyemak...'

    const { error } = await supabase.auth.signInWithPassword({ email, password })

    loginBtn.disabled = false
    loginBtn.textContent = 'Log Masuk'

    if (error) {
      Swal.fire('Ralat', 'Emel atau kata laluan salah.', 'error')
      return
    }

    showDashboard()
  })

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut()
    showLogin()
  })

  searchBox.addEventListener('input', () => {
    const term = searchBox.value.toLowerCase().trim()
    if (!term) {
      renderRows(allParticipants)
      return
    }
    const filtered = allParticipants.filter(p =>
      p.full_name.toLowerCase().includes(term) ||
      p.mykad_number.includes(term)
    )
    renderRows(filtered)
  })

  // ---------------- Export to Excel ----------------
  // Exports whatever is currently displayed (respects the active search filter).
  // Fetched fresh each click so it reflects any draw that happened since page load.
  async function getWonParticipantIds() {
    const { data, error } = await supabase.from('winners').select('participant_id')
    if (error) {
      console.error(error)
      return new Set()
    }
    return new Set((data || []).map(w => w.participant_id))
  }

  exportBtn.addEventListener('click', async () => {
    if (currentList.length === 0) {
      Swal.fire('Tiada Data', 'Tiada peserta untuk dieksport.', 'info')
      return
    }

    exportBtn.disabled = true
    exportBtn.textContent = 'Menyediakan...'

    const wonIds = await getWonParticipantIds()

      const rows = currentList.map((p, i) => ({
      '#': i + 1,
      'Nama Penuh': p.full_name,
      'No. MyKad': p.mykad_number,
      'No. Telefon': p.phone_number || '-',
      'Emel': p.email || '-',
      'Penyertaan': p.urus_setia ? 'Urus Setia' : 'Awam',
      'Tarikh Daftar': formatDate(p.created_at),
      'Winner': wonIds.has(p.id) ? 'Yes' : 'No'
    }))

    const worksheet = XLSX.utils.json_to_sheet(rows)
    const workbook = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Peserta')

    const dateStamp = new Date().toISOString().slice(0, 10)
    XLSX.writeFile(workbook, `senarai-peserta-${dateStamp}.xlsx`)

    exportBtn.disabled = false
    exportBtn.textContent = '📤 Eksport ke Excel'
  })

  // ---------------- Delete selected rows ----------------
  deleteSelectedBtn.addEventListener('click', async () => {
    if (selectedIds.size === 0) return

    const result = await Swal.fire({
      icon: 'warning',
      title: `Padam ${selectedIds.size} peserta?`,
      text: 'Tindakan ini tidak boleh dibatalkan.',
      showCancelButton: true,
      confirmButtonText: 'Ya, padam',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#dc3545'
    })
    if (!result.isConfirmed) return

    const idsToDelete = Array.from(selectedIds)
    const { error } = await supabase.from('participants').delete().in('id', idsToDelete)

    if (error) {
      const msg = error.code === '23503'
        ? 'Sebahagian peserta yang dipilih sudah pernah menang cabutan, jadi tidak boleh dipadam terus. Padam rekod kemenangan mereka dahulu jika benar-benar mahu memadam peserta ini.'
        : 'Gagal memadam: ' + error.message
      Swal.fire('Ralat', msg, 'error')
      return
    }

    Swal.fire({ icon: 'success', title: 'Berjaya dipadam', timer: 1500, showConfirmButton: false })
    await loadParticipants()
  })

  // ---------------- Clear entire list (prep for a new program) ----------------
  // Destructive and irreversible, so it requires typing PADAM to confirm
  // rather than a single click.
  clearAllBtn.addEventListener('click', async () => {
    const { value: confirmText } = await Swal.fire({
      icon: 'warning',
      title: 'Kosongkan SEMUA senarai peserta?',
      html: `Ini akan memadam <strong>${allParticipants.length} peserta</strong> secara kekal — sesuai untuk sedia senarai baharu bagi program akan datang.<br><br>Taip <strong>PADAM</strong> untuk mengesahkan:`,
      input: 'text',
      inputPlaceholder: 'PADAM',
      showCancelButton: true,
      confirmButtonText: 'Kosongkan Senarai',
      confirmButtonColor: '#dc3545',
      cancelButtonText: 'Batal',
      preConfirm: (value) => {
        if (value !== 'PADAM') {
          Swal.showValidationMessage('Sila taip PADAM dengan tepat untuk mengesahkan.')
        }
        return value
      }
    })
    if (confirmText !== 'PADAM') return

    // Supabase requires an explicit filter on delete (no unconditional
    // "delete everything") — this condition matches every row since
    // every participant has a non-null id.
    const { error } = await supabase.from('participants').delete().not('id', 'is', null)

    if (error) {
      const msg = error.code === '23503'
        ? 'Tidak dapat mengosongkan senarai kerana masih ada rekod pemenang berkaitan. Jalankan SQL untuk membenarkan padam berlonggok (ON DELETE CASCADE) — rujuk arahan yang diberikan.'
        : 'Gagal mengosongkan senarai: ' + error.message
      Swal.fire('Ralat', msg, 'error')
      return
    }

    Swal.fire({ icon: 'success', title: 'Senarai telah dikosongkan', timer: 1500, showConfirmButton: false })
    await loadParticipants()
  })
</script>

</body>
</html>
